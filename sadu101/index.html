<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>سدو أوكي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="سدو أوكي — أوكي 101 بطابع سدو بلاست: رتّب حجارك، انزل بـ101، وخلّص قبل الكل.">
<meta name="theme-color" content="#ebe4d2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Silkscreen&family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-column like Sadu Blast — woven cream ground, Sadu strips top & bottom, woven tiles, board framed by Sadu edge */
:root{
  --t-red:#ae1530; --t-yel:#ecb93e; --t-blu:#2459a8; --t-blk:#171414; --t-cream:#f2ebdb;
  --bg:#ebe4d2; --weave:rgba(70,50,25,.055); --ink:#1d1916; --mut:#6c6152;
  --card:#fbf8f0; --card-edge:#d8cdb7; --chip:#ddd4c1; --chip-edge:#c9bea8;
  --board:#f4eee1; --board-line:#1d1916; --edgeA:#1d1916; --edgeB:#f4eee1; --cell:rgba(40,30,15,.06);
  --accent:#a8132c; --accent-dk:#7c0d1f; --dark:#151212; --dark-dk:#000; --gold:#e9b53c; --ok:#2e9a4f;
  --strip-a:#1d1916; --strip-b:#f2ebdb;
  --display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;
  --pixel:"Silkscreen","Courier New",monospace;
  --tw:30px; --mw:20px;
  color-scheme:light;
}
:root[data-theme="night"]{--bg:#151112;--weave:rgba(255,255,255,.025);--ink:#f3ecdf;--mut:#a89b89;--card:#221c1b;--card-edge:#352d2b;--chip:#2a2321;--chip-edge:#3a3230;
  --board:#100d0d;--board-line:#3d3535;--edgeA:#f1eadb;--edgeB:#100d0d;--cell:rgba(255,255,255,.045);--dark:#2b2423;--dark-dk:#0b0909;color-scheme:dark}
:root[data-theme="tent"]{--bg:#141010;--weave:rgba(255,255,255,.025);--ink:#f3ecdf;--mut:#b09f8b;--card:#211a1a;--card-edge:#3a2c2c;--chip:#2a2121;--chip-edge:#3d2f2f;
  --board:#0f0b0b;--board-line:#c4162f;--edgeA:#c4162f;--edgeB:#f1eadb;--cell:rgba(255,255,255,.045);--accent:#c4162f;--dark:#2b2222;--dark-dk:#0b0909;--strip-a:#c4162f;--strip-b:#f1eadb;color-scheme:dark}
:root[data-theme="saffaifa"]{--bg:#6b1020;--weave:rgba(0,0,0,.09);--ink:#fbefe0;--mut:#efc8a6;--card:rgba(25,6,9,.42);--card-edge:rgba(255,255,255,.1);--chip:rgba(25,6,9,.35);--chip-edge:rgba(255,255,255,.12);
  --board:#1d0b0d;--board-line:#e9b53c;--edgeA:#e9b53c;--edgeB:#d4561d;--cell:rgba(255,255,255,.05);--accent:#e9b53c;--accent-dk:#9c7419;--dark:#1d0b0d;--dark-dk:#000;--strip-a:#f1eadb;--strip-b:#6b1020;color-scheme:dark}
:root[data-theme="saffaifa"] .btn,:root[data-theme="saffaifa"] .act.red,:root[data-theme="saffaifa"] .mode.red,:root[data-theme="saffaifa"] .gems .plus{color:#2a1500}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background-color:var(--bg);color:var(--ink);font-family:var(--display);user-select:none;-webkit-user-select:none;overscroll-behavior:none;
  background-image:repeating-linear-gradient(0deg,transparent 0 3px,var(--weave) 3px 4px),repeating-linear-gradient(90deg,transparent 0 3px,var(--weave) 3px 4px)}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* sadu strip: threads + zigzag teeth */
.strip{height:18px;flex:none;position:relative;background:repeating-linear-gradient(90deg,var(--strip-a) 0 2px,var(--strip-b) 2px 4px)}
.strip::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,transparent 0 9px,var(--strip-b) 9px 11px,transparent 11px 20px);opacity:.9}
.strip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;
  background:linear-gradient(135deg,var(--strip-a) 33%,transparent 33%) 0 0/10px 7px,linear-gradient(225deg,var(--strip-a) 33%,transparent 33%) 0 0/10px 7px,var(--bg)}
.strip.b{transform:scaleY(-1)}
:root[data-theme="night"] .strip{background:repeating-linear-gradient(90deg,#d4561d 0 26px,#e9b53c 26px 52px,#2a6a3a 52px 78px,#f1eadb 78px 90px,#2459a8 90px 116px,#ae1530 116px 142px)}
:root[data-theme="night"] .strip::before{background:repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px)}
:root[data-theme="night"] .strip::after{background:linear-gradient(135deg,transparent 50%,var(--bg) 50%) 0 0/13px 7px,linear-gradient(225deg,transparent 50%,var(--bg) 50%) 0 0/13px 7px}

/* ---------- shared bits ---------- */
.gems{display:inline-flex;align-items:center;gap:9px;background:var(--chip);border:1px solid var(--chip-edge);border-radius:99px;padding:5px 6px 5px 14px;font:700 19px/1 var(--display);direction:ltr}
.gem{width:17px;height:17px;transform:rotate(45deg);border-radius:4px;background:var(--gold);box-shadow:0 0 10px rgba(233,181,62,.55)}
:root:not([data-theme]) .gem,:root[data-theme="sadu"] .gem{background:var(--t-blk);box-shadow:0 0 0 2px var(--chip) inset,0 0 8px rgba(0,0,0,.25)}
.gems .plus{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font:800 20px/30px var(--display);text-align:center}
.chip{background:var(--chip);border:1px solid var(--chip-edge);border-radius:18px;padding:10px 18px;font:700 16px var(--display);
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 1px,transparent 1px 3px)}
.ico{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ---------- HOME ---------- */
.home{flex:1;overflow-y:auto;padding-block:16px 22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.toprow{display:flex;justify-content:flex-start;align-items:center;margin-top:18px}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0 6px}
.rope{display:flex;gap:10px;direction:ltr;position:relative;padding:0 12px}
.rope::before{content:"";position:absolute;left:0;right:0;top:52%;height:9px;background:var(--accent);border-radius:5px}
.rope .tile{--tw:66px;border-radius:9px}
.rope .tile b{font-size:38px}
.rope .tile:nth-child(1){transform:rotate(-4deg)}.rope .tile:nth-child(2){transform:rotate(2deg) translateY(2px)}.rope .tile:nth-child(3){transform:rotate(-1deg)}.rope .tile:nth-child(4){transform:rotate(3deg)}
.rope .tile em{position:absolute;top:5px;left:8px;font:800 12px/1 var(--display);font-style:normal;opacity:.9;z-index:2}
.wordmark{font:400 56px/1 var(--pixel);color:var(--accent);letter-spacing:4px;text-shadow:0 4px 0 rgba(0,0,0,.22);margin-top:8px;direction:ltr;transform:rotate(-2deg)}
.tag{font:700 19px var(--display);color:var(--mut);opacity:.9}
.mode{display:flex;align-items:center;gap:18px;border-radius:30px;padding:16px 18px;text-align:start;width:100%;position:relative;overflow:hidden;transition:transform .12s}
.mode::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 1px,transparent 1px 4px);pointer-events:none}
.mode:active{transform:translateY(3px)}
.mode .ic{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.14)}
.mode b{display:block;font:800 26px/1.15 var(--display)}
.mode small{display:block;font:700 16px/1.3 var(--display);opacity:.85;margin-top:2px}
.mode.dark{background:var(--dark);color:#fff;box-shadow:0 6px 0 var(--dark-dk),0 14px 24px rgba(0,0,0,.12)}
.mode.red{background:var(--accent);color:#fff;box-shadow:0 6px 0 var(--accent-dk),0 14px 24px rgba(168,19,44,.18)}
.mode.light{background:var(--card);color:var(--ink);border:1px solid var(--card-edge);box-shadow:0 6px 0 var(--card-edge),0 14px 24px rgba(0,0,0,.05)}
.mode.light .ic{background:transparent}
.mode.light::after{background:repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0 1px,transparent 1px 4px)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mode.small{border-radius:26px;padding:16px 18px;box-shadow:0 4px 0 var(--card-edge)}
.mode.small b{font-size:20px}.mode.small small{font-size:15px}
.mode small.new{color:var(--accent);opacity:1}
.chips{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

/* ---------- TILES (woven) ---------- */
.tile{--tb:var(--t-cream);--tf:#1d1916;width:var(--tw);height:calc(var(--tw)*1.3);border-radius:calc(var(--tw)*.2);flex:none;position:relative;
  background:var(--tb);color:var(--tf);display:flex;align-items:center;justify-content:center;padding-bottom:calc(var(--tw)*.12);
  box-shadow:inset 0 calc(var(--tw)*-.1) 0 rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.35),0 2px 3px rgba(0,0,0,.28);transition:transform .15s,box-shadow .15s;touch-action:none}
.tile::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.13) 0 1px,rgba(0,0,0,.06) 1px 2px,transparent 2px 4px)}
.tile::after{content:"";position:absolute;left:12%;right:12%;bottom:calc(var(--tw)*.14);height:calc(var(--tw)*.1);pointer-events:none;
  background:radial-gradient(circle,var(--st,rgba(255,255,255,.7)) 38%,transparent 42%) 0 50%/calc(var(--tw)*.16) 100% repeat-x}
.tile b{position:relative;font:800 calc(var(--tw)*.6)/1 var(--display);letter-spacing:-.5px;z-index:1}
.tile.c0{--tb:var(--t-red);--tf:#fff;--st:rgba(255,200,205,.75)}
.tile.c1{--tb:var(--t-yel);--tf:#1d1916;--st:rgba(90,60,0,.55)}
.tile.c2{--tb:var(--t-blu);--tf:#fff;--st:rgba(200,225,255,.75)}
.tile.c3{--tb:var(--t-blk);--tf:#fff;--st:rgba(255,255,255,.55);box-shadow:inset 0 0 0 calc(var(--tw)*.05) rgba(255,255,255,.4),inset 0 calc(var(--tw)*-.1) 0 rgba(255,255,255,.08),0 2px 3px rgba(0,0,0,.35)}
.tile.fake{--st:rgba(0,0,0,.35)}
.tile .fj{position:relative;z-index:1;font:800 calc(var(--tw)*.66)/1 var(--display);background:conic-gradient(var(--t-red) 0 25%,var(--t-yel) 0 50%,var(--t-blu) 0 75%,var(--t-blk) 0);-webkit-background-clip:text;background-clip:text;color:transparent}
.tile s{position:absolute;top:-5px;left:-5px;width:15px;height:15px;border-radius:50%;background:var(--gold);color:#4a2f00;font:800 10px/15px var(--display);text-decoration:none;text-align:center;z-index:3;box-shadow:0 1px 2px rgba(0,0,0,.45)}
.tile.back{--tb:var(--accent);--st:rgba(255,255,255,.5)}
.tile.back::before{background:repeating-linear-gradient(90deg,rgba(255,255,255,.13) 0 1px,transparent 1px 3px),linear-gradient(135deg,transparent 40%,rgba(255,255,255,.28) 40% 60%,transparent 60%)}
.mini{--tw:var(--mw)}
.mini s{width:12px;height:12px;font-size:8px;line-height:12px;top:-4px;left:-4px}

/* ---------- GAME ---------- */
.game{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.ghead{display:flex;align-items:stretch;gap:8px;padding-top:8px}
.brand{flex:1;display:flex;flex-direction:column;justify-content:center;line-height:1.15;min-width:0}
.brand small{font:700 11px var(--display);letter-spacing:2px;color:var(--mut);direction:ltr;text-align:end}
.brand span{font:800 21px var(--display);color:var(--mut)}
.sbox{background:var(--card);border:1px solid var(--card-edge);border-radius:16px;padding:5px 12px;min-width:86px;text-align:center;line-height:1.1;
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0 1px,transparent 1px 3px)}
.sbox small{display:block;font:700 11px var(--display);letter-spacing:1.5px;color:var(--mut)}
.sbox b{font:800 22px var(--display);direction:ltr;display:block;font-variant-numeric:tabular-nums}
.subrow{display:flex;align-items:center;gap:8px;padding:8px 0 6px}
.subrow .info{flex:1;font:600 15px var(--display);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subrow .info b{color:var(--ink)}
.pillx{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--chip-edge);border-radius:99px;padding:4px 12px;font:700 15px var(--display);direction:ltr;font-variant-numeric:tabular-nums}
.pillx .ico{width:17px;height:17px}
.pillx.low{background:var(--accent);color:#fff;border-color:transparent}
.menubtn{width:38px;height:34px;border-radius:12px;background:var(--chip);border:1px solid var(--chip-edge);display:grid;place-items:center}
.menubtn .ico{width:20px;height:20px}
.subrow .gems{font-size:15px;padding:3px 4px 3px 10px;gap:6px}
.subrow .gem{width:13px;height:13px}
.subrow .gems .plus{width:24px;height:24px;font-size:16px;line-height:24px}
.opps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opp{background:var(--card);border:1px solid var(--card-edge);border-radius:16px;padding:6px 6px 6px 4px;display:flex;align-items:center;gap:6px;position:relative;min-width:0;transition:box-shadow .2s,border-color .2s}
.opp.turn{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 15px var(--display);color:#fff;
  background:repeating-conic-gradient(var(--t-red) 0 12.5%,var(--t-cream) 0 25%);padding:3px}
.av span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--c)}
.opp .info{flex:1;min-width:0;line-height:1.2;padding-left:calc(var(--mw) + 4px)}
.opp .nm{font:800 14px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp .meta{font:600 12px var(--display);color:var(--mut);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.opp .meta b{color:var(--ink);direction:ltr}
.badge{background:var(--ok);color:#fff;border-radius:6px;padding:0 5px;font:700 10px/16px var(--display)}
.badge.pr{background:#6e2a6b}
.opp .dis{position:absolute;left:5px;top:6px;min-width:var(--mw);height:calc(var(--mw)*1.3);border-radius:5px;border:1px dashed var(--card-edge)}
.opp .dis.take{border:2px solid var(--gold);border-radius:6px;animation:pulse 1.2s infinite}
.thinking{display:inline-block;animation:blink 1s infinite;color:var(--gold)}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(233,181,62,.35)}}
@keyframes blink{50%{opacity:.3}}
/* the board — framed like Sadu Blast */
.board{position:relative;margin-top:8px;flex:1;min-height:80px;display:flex;flex-direction:column;background:var(--board);border:3px solid var(--board-line);border-radius:18px;overflow:hidden}
.board::before,.board::after{content:"";position:absolute;left:0;right:0;height:6px;z-index:2;background:repeating-linear-gradient(90deg,var(--edgeA) 0 8px,var(--edgeB) 8px 14px)}
.board::before{top:0}.board::after{bottom:0}
.table{flex:1;overflow-y:auto;padding:12px 10px 6px;direction:ltr;min-height:0}
.table .empty{direction:rtl;text-align:center;color:var(--mut);font:600 15px var(--display);margin-top:14px}
.mrow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:6px}
.mrow .who{direction:rtl;font:700 11px var(--display);color:var(--mut);background:var(--cell);padding:1px 8px;border-radius:8px}
.meld{display:flex;gap:2px;padding:4px;border-radius:9px;background:var(--cell);border:2px solid transparent;transition:border-color .15s,background .15s}
.meld.target{border-color:var(--gold);background:rgba(233,181,62,.2)}
.meld.newm{animation:pop .35s}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.center{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;padding:6px 10px 12px;border-top:1px dashed var(--card-edge)}
.pile{display:flex;flex-direction:column;align-items:center;gap:3px;font:700 11px var(--display);color:var(--mut);min-width:54px}
.pile .slotbox{--tw:32px;width:var(--tw);height:calc(var(--tw)*1.3);border-radius:7px;border:2px dashed var(--card-edge);display:grid;place-items:center;position:relative}
.pile .slotbox .tile{--tw:32px}
.pile.active .slotbox{border-color:var(--gold);border-style:solid;animation:pulse 1.2s infinite}
.deck .cnt{position:absolute;bottom:-5px;right:-10px;background:var(--ink);color:var(--bg);border-radius:8px;font:700 11px/16px var(--display);padding:0 5px;z-index:3}
.indic{display:flex;align-items:center;gap:7px;background:var(--cell);border-radius:12px;padding:5px 8px}
.indic .lab{font:600 11px/1.25 var(--display);color:var(--mut);text-align:center}
.indic .lab b{color:var(--ink);font-size:14px}
.indic .tile{--tw:26px}
.status{display:flex;gap:8px;align-items:center;padding:8px 2px 2px;font:600 14px var(--display);color:var(--mut);flex-wrap:wrap}
.status b{color:var(--ink);font-variant-numeric:tabular-nums}
.status b.good{color:var(--ok)}
.status .msg{margin-inline-start:auto;color:var(--ink);font-weight:700}
.actions{display:flex;gap:6px;padding-top:6px}
.act{flex:1;height:46px;border-radius:16px;font:800 18px var(--display);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.act::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 4px);pointer-events:none}
.act:active{transform:translateY(2px)}
.act.red{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-dk)}
.act.dark{background:var(--dark);color:#fff;box-shadow:0 4px 0 var(--dark-dk)}
.act.light{flex:none;width:58px;background:var(--card);border:1px solid var(--card-edge);box-shadow:0 4px 0 var(--card-edge);direction:ltr;font-size:16px}
.act[disabled]{opacity:.38;pointer-events:none}
.boost{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-top:10px}
.bst{background:var(--card);border:1px solid var(--card-edge);border-radius:16px;padding:5px 2px;line-height:1.15;
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0 1px,transparent 1px 3px)}
.bst b{display:block;font:800 15px var(--display)}
.bst small{font:700 11px var(--display);color:var(--mut)}
.bst[disabled]{opacity:.4;pointer-events:none}
.rack{flex:none;position:relative;margin-top:10px;padding:13px 6px 13px;direction:ltr;background:var(--board);border:3px solid var(--board-line);border-radius:18px 18px 0 0;border-bottom:0}
.rack::before,.rack::after{content:"";position:absolute;left:0;right:0;height:6px;background:repeating-linear-gradient(90deg,var(--edgeA) 0 8px,var(--edgeB) 8px 14px)}
.rack::before{top:0;border-radius:14px 14px 0 0}.rack::after{bottom:0}
.rack.myturn{box-shadow:0 -2px 0 3px var(--gold)}
.rrow{display:grid;grid-template-columns:repeat(13,var(--tw));gap:3px;justify-content:center}
.rrow+.rrow{margin-top:6px}
.slot{width:var(--tw);height:calc(var(--tw)*1.3);border-radius:calc(var(--tw)*.2);position:relative;background:var(--cell)}
.slot.hot{background:rgba(233,181,62,.35)}
.slot .tile.ok{box-shadow:0 0 0 2px var(--ok),0 0 9px var(--ok),inset 0 calc(var(--tw)*-.1) 0 rgba(0,0,0,.22)}
.slot .tile.sel{transform:translateY(-7px);box-shadow:0 0 0 2px var(--gold),0 7px 10px rgba(0,0,0,.4)}
.slot .tile.newt{animation:drop .4s}
.slot .tile.hint{animation:hintg 1s 3}
@keyframes hintg{50%{box-shadow:0 0 0 3px var(--gold),0 0 14px var(--gold)}}
@keyframes drop{0%{transform:translateY(-30px);opacity:0}}
.tile.dragging{opacity:.25}
.ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-60%) scale(1.15) rotate(-3deg);box-shadow:0 12px 20px rgba(0,0,0,.45)}

<body>
<div class="app" id="app"></div>
<script>
(()=>{
'use strict';
/* ================= persistence ================= */
const LS='sadu101.v1';
const defaults=()=>({gems:150,theme:'sadu',sound:true,vib:true,level:1,stars:{},streak:0,best:null,
  stats:{games:0,wins:0,outs:0,rounds:0},daily:{},gift:'',save:null,diff:1,rounds:3});
let S;
try{S=Object.assign(defaults(),JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){S=defaults()}
const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
if(!['sadu','night','tent','saffaifa'].includes(S.theme))S.theme='sadu';
document.documentElement.dataset.theme=S.theme;

/* ================= sound ================= */
let AC=null;
function snd(k){
  if(!S.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const seq={tap:[[700,.04,'triangle',.08]],place:[[260,.05,'square',.05],[180,.05,'square',.04]],draw:[[420,.06,'triangle',.08]],
      lay:[[523,.09,'sine',.12],[659,.09,'sine',.12],[784,.14,'sine',.12]],err:[[150,.16,'sawtooth',.06]],
      win:[[523,.12,'sine',.14],[659,.12,'sine',.14],[784,.12,'sine',.14],[1046,.3,'sine',.14]],
      lose:[[392,.15,'sine',.1],[330,.15,'sine',.1],[262,.3,'sine',.1]],coin:[[988,.06,'square',.05],[1318,.12,'square',.05]],tick:[[1200,.03,'square',.04]]}[k]||[];
    let t=AC.currentTime;
    seq.forEach(([f,d,type,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.8;});
  }catch(e){}
}
const buzz=ms=>{if(S.vib&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}};

/* ================= rng ================= */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=Math.random;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ================= core model ================= */
const CN=['أحمر','أصفر','أزرق','أسود'];
const NAMES=['أنت','سلمان','نورة','بو فهد'];
const AVC=['#ae1530','#2459a8','#6e2a6b','#d4561d'];
const DIFFN=['سهل','عادي','صعب'];
let G=null;               // current game
const isWild=t=>t&&t.c>=0&&t.c===G.okC&&t.n===G.okN;
function eff(t){ if(t.c<0) return {c:G.okC,n:G.okN,w:false}; if(isWild(t)) return {c:t.c,n:t.n,w:true}; return {c:t.c,n:t.n,w:false}; }
const tval=t=>eff(t).n;

/* validate a set of tiles as a meld. returns {type,pts,tiles(ordered)} or null */
function validateMeld(tiles,allowPair=true){
  const ws=[],nat=[];
  tiles.forEach(t=>{const e=eff(t); if(e.w) ws.push(t); else nat.push({t,c:e.c,n:e.n});});
  const L=tiles.length;
  if(L===2){
    if(!allowPair) return null;
    if(ws.length>=1||(nat[0].c===nat[1].c&&nat[0].n===nat[1].n)){
      const n=nat.length?nat[0].n:G.okN; return {type:'pair',pts:n*2,tiles:[...nat.map(x=>x.t),...ws]};
    }
    return null;
  }
  if(L<3||L>13||nat.length===0) return null;
  // group
  if(L<=4){
    const n=nat[0].n;
    if(nat.every(x=>x.n===n)&&new Set(nat.map(x=>x.c)).size===nat.length){
      const ord=[...nat].sort((a,b)=>a.c-b.c).map(x=>x.t);
      return {type:'group',pts:n*L,tiles:[...ord,...ws]};
    }
  }
  // run
  const c=nat[0].c; if(!nat.every(x=>x.c===c)) return null;
  const hasOne=nat.some(x=>x.n===1);
  const modes=hasOne?[false,true]:[null];
  let best=null;
  for(const high of modes){
    const vs=nat.map(x=>({t:x.t,v:(high&&x.n===1)?14:x.n})).sort((a,b)=>a.v-b.v);
    let dup=false; for(let i=1;i<vs.length;i++) if(vs[i].v===vs[i-1].v) dup=true;
    if(dup) continue;
    const minB=high===true?2:1, maxB=high===false?13:14;
    const lo=vs[0].v, hi=vs[vs.length-1].v;
    const gaps=(hi-lo+1)-vs.length; if(gaps>ws.length) continue;
    const extra=ws.length-gaps; const top=Math.min(extra,maxB-hi); const bot=extra-top;
    if(lo-bot<minB) continue;
    const ord=[];let wi=0;const map=new Map(vs.map(x=>[x.v,x.t]));let pts=0;
    for(let v=lo-bot;v<=hi+top;v++){ ord.push(map.has(v)?map.get(v):ws[wi++]); pts+=v; }
    if(!best||pts>best.pts) best={type:'run',pts,tiles:ord};
  }
  return best;
}

/* ---- solver: best set of runs/groups (max points) ---- */
function solveRuns(tiles){
  const buckets=Array.from({length:52},()=>[]);const wilds=[];
  tiles.forEach(t=>{const e=eff(t); if(e.w) wilds.push(t); else buckets[e.c*13+e.n-1].push(t);});
  const cnt=buckets.map(b=>b.length); let w=wilds.length;
  const memo=new Map();
  const key=()=>cnt.join('')+'|'+w; // counts 0..2 single digit (fake jokers may make 3)
  function opts(i){
    const c=Math.floor(i/13),n=i%13+1,res=[];
    // groups
    const others=[0,1,2,3].filter(cc=>cc!==c&&cnt[cc*13+n-1]>0);
    for(let m=0;m<(1<<others.length);m++){
      const ks=[i];others.forEach((cc,j)=>{if(m&(1<<j)) ks.push(cc*13+n-1)});
      for(let wk=0;wk<=Math.min(w,2);wk++){const L=ks.length+wk; if(L>=3&&L<=4) res.push({ks,wk,pts:n*L});}
    }
    // runs
    for(const pv of (n===1?[1,14]:[n])){
      for(let s=Math.max(pv===14?2:1,pv-12);s<=pv;s++){
        if(pv===1&&s!==1) continue;
        let wk=0;const ks=[];let pts=0;let ok=true;
        for(let e=s;e<=Math.min(s+12,pv===1?13:14);e++){
          if(e===pv) ks.push(i);
          else{const kv=c*13+((e===14?1:e)-1); if(kv!==i&&cnt[kv]>0) ks.push(kv); else wk++;}
          pts+=e;
          if(wk>w){ok=false;break;}
          if(e>=pv&&e-s+1>=3) res.push({ks:[...ks],wk,pts});
        }
      }
    }
    return res;
  }
  function rec(){
    const i=cnt.findIndex(x=>x>0); if(i<0) return 0;
    const k=key(); if(memo.has(k)) return memo.get(k);
    cnt[i]--; let best=rec(); cnt[i]++;
    for(const o of opts(i)){
      o.ks.forEach(x=>cnt[x]--); w-=o.wk;
      const v=o.pts*100+o.ks.length+o.wk+rec();
      o.ks.forEach(x=>cnt[x]++); w+=o.wk;
      if(v>best) best=v;
    }
    memo.set(k,best); return best;
  }
  rec();
  // reconstruct
  const melds=[],rest=[];const bk=buckets.map(b=>[...b]);const wl=[...wilds];
  while(true){
    const i=cnt.findIndex(x=>x>0); if(i<0) break;
    const target=rec();
    cnt[i]--; const skip=rec(); cnt[i]++;
    if(skip===target){ cnt[i]--; rest.push(bk[i].pop()); continue; }
    let done=false;
    for(const o of opts(i)){
      o.ks.forEach(x=>cnt[x]--); w-=o.wk;
      const v=o.pts*100+o.ks.length+o.wk+rec();
      if(v===target){ melds.push([...o.ks.map(x=>bk[x].pop()),...wl.splice(0,o.wk)]); done=true; break; }
      o.ks.forEach(x=>cnt[x]++); w+=o.wk;
    }
    if(!done){ cnt[i]--; rest.push(bk[i].pop()); }
  }
  rest.push(...wl);
  const vm=melds.map(m=>validateMeld(m,false)).filter(Boolean);
  // any meld that failed validation goes back to rest (safety)
  const used=new Set(vm.flatMap(v=>v.tiles.map(t=>t.id)));
  const rest2=tiles.filter(t=>!used.has(t.id));
  return {melds:vm.map(v=>v.tiles),pts:vm.reduce((a,v)=>a+v.pts,0),rest:rest2};
}
function pairsOf(tiles){
  const map=new Map();const wl=[];
  tiles.forEach(t=>{const e=eff(t); if(e.w){wl.push(t);return;} const k=e.c*13+e.n; if(!map.has(k)) map.set(k,[]); map.get(k).push(t);});
  const pairs=[],singles=[];
  map.forEach(a=>{while(a.length>=2) pairs.push([a.pop(),a.pop()]); if(a.length) singles.push(a[0]);});
  singles.sort((a,b)=>tval(b)-tval(a));
  while(wl.length&&singles.length) pairs.push([singles.shift(),wl.pop()]);
  if(wl.length===2) pairs.push([wl.pop(),wl.pop()]);
  return pairs;
}
const meldPts=m=>{const v=validateMeld(m.tiles||m);return v?v.pts:0};

/* ================= game setup ================= */
function makeTiles(){const t=[];let id=1;for(let k=0;k<2;k++)for(let c=0;c<4;c++)for(let n=1;n<=13;n++)t.push({id:id++,c,n});t.push({id:id++,c:-1,n:0},{id:id++,c:-1,n:0});return t;}
function newGame(mode,opt={}){
  const lv=opt.level||S.level;
  const cfg={
    adventure:{rounds:lv<6?1:lv<16?2:3,diff:lv<=3?0:lv<=12?1:2},
    classic:{rounds:S.rounds,diff:S.diff},
    daily:{rounds:1,diff:1},
    time:{rounds:1,diff:1}
  }[mode];
  G={mode,level:lv,rounds:cfg.rounds,diff:cfg.diff,round:0,totals:[0,0,0,0],history:[],
    seed:mode==='daily'?hashStr(today()):Math.floor(Math.random()*1e9),
    startOff:mode==='daily'?0:Math.floor(Math.random()*4),
    boosters:{undo:2,hint:2,peek:1,swap:1},outs:0};
  startRound();
}
function hashStr(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function startRound(){
  G.round++;
  rnd=G.mode==='daily'?mulberry(G.seed+G.round*7919):Math.random;
  const tiles=shuffle(makeTiles());
  let ii=tiles.findIndex(t=>t.c>=0);
  G.ind=tiles.splice(ii,1)[0];
  G.okC=G.ind.c; G.okN=G.ind.n%13+1;
  G.starter=(G.round-1+G.startOff)%4;
  G.players=[0,1,2,3].map(i=>({opened:false,pairs:false,discard:[],hand:[]}));
  for(let i=0;i<4;i++){const p=(G.starter+i)%4;G.players[p].hand=tiles.splice(0,i===0?22:21);}
  G.deck=tiles;
  G.rack=Array(26).fill(null);
  const mine=G.players[0].hand; G.players[0].hand=[];
  arrangeTiles(mine,'color');
  G.melds=[];G.mid=1;G.turn=G.starter;G.phase='play';G.taken=null;G.sel=null;G.undo=[];
  G.peek=false;G.swapUsed=false;G.over=false;G.last=null;G.newMeld=null;G.token=(G.token||0)+1;G.timeLeft=25;
  G.roundResult=null;
  save(); render();
  flash(`الجولة ${G.round}`);
  if(G.turn!==0) schedBot(); else toast('أنت تبدأ — معك 22 حجر، ارمِ حجر');
}
const hand=p=>p===0?G.rack.filter(Boolean):G.players[p].hand;
function save(){ if(G&&!G.final){ S.save=G; } persist(); }

/* ================= rack helpers ================= */
function rackGroups(){
  const gs=[];
  for(let r=0;r<2;r++){let cur=[];for(let c=0;c<13;c++){const t=G.rack[r*13+c];if(t)cur.push(t);else{if(cur.length)gs.push(cur);cur=[];}}if(cur.length)gs.push(cur);}
  return gs;
}
function placeIntoRack(groups,rest){
  const slots=Array(26).fill(null);let r=0,c=0;const over=[];
  const place=arr=>{const need=arr.length;if(c>0){if(c+1+need<=13)c++;else{r++;c=0}}if(r>1||c+need>13)return false;arr.forEach(t=>slots[r*13+(c++)]=t);return true};
  groups.forEach(g=>{if(!place(g))over.push(...g)});
  const left=[...over,...rest];
  let pos=r*13+c+(c>0?1:0);
  for(const t of left){while(pos<26&&slots[pos])pos++; if(pos<26) slots[pos++]=t; else{const k=slots.indexOf(null);slots[k]=t;}}
  G.rack=slots;
}
const sortKey=t=>{const e=eff(t);return (e.w||t.c<0)?999:e.c*20+e.n};
function arrangeTiles(tiles,kind){
  if(kind==='color'){
    const s=[...tiles].sort((a,b)=>sortKey(a)-sortKey(b));
    // group by colour with gaps
    const gs=[];let cur=[],lc=null;s.forEach(t=>{const k=Math.floor(sortKey(t)/20);if(lc!==null&&k!==lc){gs.push(cur);cur=[]}cur.push(t);lc=k});if(cur.length)gs.push(cur);
    const split=[];gs.forEach(g=>{while(g.length>13)split.push(g.splice(0,13));split.push(g)});
    // if not enough room with gaps, place compactly
    const need=split.reduce((a,g)=>a+g.length,0)+split.length-1;
    if(need<=26-2) placeIntoRack(split,[]); else {G.rack=Array(26).fill(null);s.forEach((t,i)=>G.rack[i]=t);}
    return;
  }
  if(kind==='123'){const sol=solveRuns(tiles);placeIntoRack(sol.melds,sol.rest.sort((a,b)=>sortKey(a)-sortKey(b)));return;}
  if(kind==='77'){const pr=pairsOf(tiles);const ids=new Set(pr.flat().map(t=>t.id));placeIntoRack(pr,tiles.filter(t=>!ids.has(t.id)).sort((a,b)=>sortKey(a)-sortKey(b)));}
}
function addToRack(t){
  for(let i=25;i>=0;i--) if(!G.rack[i]){G.rack[i]=t;return;}
}
function removeFromRack(id){const i=G.rack.findIndex(t=>t&&t.id===id);if(i<0)return null;const t=G.rack[i];G.rack[i]=null;return t;}
function moveToSlot(id,s){
  const from=G.rack.findIndex(t=>t&&t.id===id); if(from<0||from===s) return;
  const t=G.rack[from]; G.rack[from]=null;
  if(!G.rack[s]){G.rack[s]=t;return;}
  const row=Math.floor(s/13),end=row*13+12;
  // shift right if space in row
  let e=s;while(e<=end&&G.rack[e])e++;
  if(e<=end){for(let k=e;k>s;k--)G.rack[k]=G.rack[k-1];G.rack[s]=t;return;}
  let b=s;while(b>=row*13&&G.rack[b])b--;
  if(b>=row*13){for(let k=b;k<s;k++)G.rack[k]=G.rack[k+1];G.rack[s]=t;return;}
  G.rack[from]=G.rack[s];G.rack[s]=t;
}
function rackStatus(){
  const gs=rackGroups().map(g=>({g,v:validateMeld(g)}));
  const runs=gs.filter(x=>x.v&&x.v.type!=='pair'), prs=gs.filter(x=>x.v&&x.v.type==='pair');
  return {gs,runs,prs,pts:runs.reduce((a,x)=>a+x.v.pts,0)};
}

/* ================= actions (human) ================= */
const myTurn=()=>G&&!G.over&&G.turn===0;
function snapshot(){const b=G.boosters;G.undo.push(JSON.stringify(Object.assign({},G,{undo:[]})));if(G.undo.length>12)G.undo.shift();}
function drawDeck(){
  if(!myTurn()||G.phase!=='draw') return;
  if(!G.deck.length){endRound(null);return;}
  const t=G.deck.pop();addToRack(t);G.last=t.id;G.phase='play';G.peek=false;snd('draw');buzz(10);save();render();
}
function takeDiscard(){
  if(!myTurn()||G.phase!=='draw') return;
  const pile=G.players[3].discard; if(!pile.length){toast('ما في رمية');return;}
  snapshot();
  const t=pile.pop();addToRack(t);G.taken=t.id;G.last=t.id;G.phase='play';G.peek=false;snd('draw');
  toast('أخذت الرمية — لازم تستخدمها بنفس الدور (أو رجّعها بزر ترجيع)');
  save();render();
}
function discard(id){
  if(!myTurn()) return;
  if(G.phase!=='play'){toast('اسحب حجر أول');snd('err');return;}
  if(id==null){toast('اختر الحجر اللي تبي ترميه');snd('err');return;}
  if(G.taken!=null&&G.rack.some(t=>t&&t.id===G.taken)){
    if(G.taken===id) toast('ما تقدر ترمي نفس الحجر اللي أخذته — استخدمه أو رجّعه');
    else toast('لازم تستخدم الحجر اللي أخذته من الرمية قبل ما ترمي');
    snd('err');buzz(60);return;
  }
  const t=removeFromRack(id); if(!t) return;
  G.players[0].discard.push(t);G.sel=null;G.taken=null;G.undo=[];snd('place');buzz(15);
  if(!G.rack.some(Boolean)){ endRound(0,isWild(t)); return; }
  nextTurn();
}
function layRack(){
  if(!myTurn()) return;
  if(G.phase!=='play'){toast('اسحب حجر أول');snd('err');return;}
  const P=G.players[0];const st=rackStatus();const handN=hand(0).length;
  let use=null,asPairs=false;
  if(!P.opened){
    if(st.pts>=101) use=st.runs;
    else if(st.prs.length>=5){use=st.prs;asPairs=true;}
    else{
      toast(st.prs.length>=3?`تحتاج 101 نقطة (عندك ${st.pts}) أو 5 أزواج (عندك ${st.prs.length})`:`تحتاج 101 نقطة للنزول — عندك ${st.pts}. رتّب مجموعاتك وافصل بينها بفراغ`);
      snd('err');buzz(60);return;
    }
  }else{
    use=P.pairs?st.prs:st.runs;
    if(!use.length){toast(P.pairs?'نازل أزواج: تقدر تنزل أزواج بس، أو تركّب على النزولات':'ما في مجموعة صحيحة بالحامل (الأخضر = صحيح)');snd('err');return;}
  }
  const n=use.reduce((a,x)=>a+x.g.length,0);
  if(n>=handN){toast('لازم يبقى معك حجر واحد على الأقل ترميه');snd('err');return;}
  snapshot();
  use.forEach(x=>{x.g.forEach(t=>removeFromRack(t.id));G.melds.push({id:G.mid++,owner:0,type:x.v.type,tiles:x.v.tiles});});
  G.newMeld=G.mid-1;
  if(!P.opened){P.opened=true;P.pairs=asPairs;flash(asPairs?'نزلت أزواج!':'نزلت!');snd('lay');buzz([20,40,20]);}
  else snd('lay');
  G.sel=null;save();render();
}
function addToMeld(id,mid){
  if(!myTurn()) return;
  if(G.phase!=='play'){toast('اسحب حجر أول');snd('err');return;}
  const P=G.players[0];
  if(!P.opened){toast('لازم تنزل أول قبل ما تركّب على النزولات');snd('err');return;}
  if(hand(0).length<=1){toast('لازم يبقى معك حجر ترميه');snd('err');return;}
  const m=G.melds.find(x=>x.id===mid);const t=G.rack.find(x=>x&&x.id===id);if(!m||!t)return;
  const r=tryAddMeld(m,t,true);
  if(!r){toast('هالحجر ما يركب على هالنزول');snd('err');buzz(60);return;}
  snapshot();
  // apply (re-run on real objects)
  removeFromRack(id);applyAdd(m,t,true);
  G.sel=null;snd('lay');buzz(15);save();render();
}
/* what does the wild at index i in meld m stand for? -> {c,n} or for groups {n,missing:[colors]} */
function wildRep(m,i){
  const v=validateMeld(m.tiles,false); if(!v) return null;
  if(v.type==='group'){const nat=v.tiles.filter(t=>!isWild(t)).map(eff);return {group:true,n:nat[0].n,cols:nat.map(e=>e.c)};}
  const k=v.tiles.findIndex(t=>!isWild(t)); const e=eff(v.tiles[k]);
  // value of position k (handles ace-high)
  let vk=e.n; if(e.n===1&&k>0) vk=14;
  const idx=v.tiles.indexOf(m.tiles[i]);
  let val=vk+(idx-k); if(val===14) val=1;
  return {c:e.c,n:val};
}
/* returns 'add' | 'swap' | null */
function tryAddMeld(m,t,allowSwap){
  if(m.type==='pair') return null;
  if(allowSwap&&!isWild(t)){
    const e=eff(t);
    for(let i=0;i<m.tiles.length;i++){
      if(!isWild(m.tiles[i])) continue;
      const r=wildRep(m,i); if(!r) continue;
      if(r.group?(e.n===r.n&&!r.cols.includes(e.c)):(e.c===r.c&&e.n===r.n)) return 'swap';
    }
  }
  return validateMeld([...m.tiles,t],false)?'add':null;
}
function applyAdd(m,t,allowSwap){
  const r=tryAddMeld(m,t,allowSwap);
  if(r==='swap'){
    const e=eff(t);
    const i=m.tiles.findIndex((x,k)=>{if(!isWild(x))return false;const w=wildRep(m,k);return w&&(w.group?(e.n===w.n&&!w.cols.includes(e.c)):(e.c===w.c&&e.n===w.n));});
    const w=m.tiles[i];const arr=[...m.tiles];arr[i]=t;const v=validateMeld(arr,false);
    if(!v) return null;
    m.tiles=v.tiles;m.type=v.type;
    if(G.turn===0){addToRack(w);G.last=w.id;toast('أخذت الأوكي ★ من النزول!');}
    else G.players[G.turn].hand.push(w);
    return r;
  }
  if(r==='add'){const v=validateMeld([...m.tiles,t],false);m.tiles=v.tiles;m.type=v.type;}
  return r;
}
function nextTurn(){
  G.turnNo=(G.turnNo||0)+1;G.turn=(G.turn+1)%4;G.phase='draw';G.taken=null;G.undo=[];G.peek=false;G.swapUsed=false;G.sel=null;G.newMeld=null;G.timeLeft=25;
  save();render();
  if(G.turn!==0) schedBot();
}

/* ================= boosters ================= */
const BCOST=25;
function useBooster(k){
  if(!myTurn()) {toast('انتظر دورك');return false;}
  if(G.boosters[k]>0){G.boosters[k]--;return true;}
  if(S.gems>=BCOST){S.gems-=BCOST;persist();snd('coin');return true;}
  toast(`تحتاج ${BCOST} جوهرة`);snd('err');return false;
}
function bUndo(){
  if(!myTurn()) return;
  if(!G.undo.length){toast('ما في شي ترجّعه بهالدور');snd('err');return;}
  if(!useBooster('undo')) return;
  const b=G.boosters;const snap=JSON.parse(G.undo.pop());const rest=G.undo;
  G=Object.assign(snap,{boosters:b,undo:rest,token:G.token});
  snd('tap');save();render();
}
function bHint(){
  if(!myTurn()) return;
  if(!useBooster('hint')) return;
  const P=G.players[0];const h=hand(0);
  if(G.phase==='draw'){
    const d=G.players[3].discard.slice(-1)[0];
    const want=d&&botWantsDiscard(0,d,h);
    toast(want?'خذ الرمية من اللاعب اللي قبلك':'اسحب من الكومة');
    render();return;
  }
  // arrange best
  if(!P.opened||!P.pairs){const sol=solveRuns(h); if(!P.opened&&sol.pts>=101||P.opened){arrangeTiles(h,'123');}}
  if(P.pairs) arrangeTiles(h,'77');
  const st=rackStatus();
  const t=chooseDiscard(0,hand(0));
  G.hintId=t&&t.id;G.sel=t&&t.id;
  let msg='';
  if(!P.opened&&st.pts>=101) msg='رتّبتها لك — تقدر تنزل الحين! ';
  else if(!P.opened&&st.prs.length>=5) msg='عندك 5 أزواج — تقدر تنزل أزواج! ';
  else if(P.opened&&(P.pairs?st.prs:st.runs).length) msg='عندك مجموعات تقدر تنزلها. ';
  msg+=t?`ارمِ ${t.c<0?'الجوكر':(CN[t.c]+' '+t.n)}`:'';
  toast(msg);save();render();
}
function bPeek(){
  if(!myTurn()) return;
  if(G.phase!=='draw'){toast('الكشف يشتغل قبل السحب');return;}
  if(!G.deck.length) return;
  if(!useBooster('peek')) return;
  G.peek=true;snd('tap');render();
}
function bSwap(){
  if(!myTurn()) return;
  if(G.phase!=='play'){toast('اسحب أول، بعدين بدّل');return;}
  if(G.sel==null){toast('اختر حجر تبي تبدله');return;}
  if(G.swapUsed){toast('مرة وحدة بالدور');return;}
  if(G.sel===G.taken){toast('ما تقدر تبدل حجر الرمية');return;}
  if(!G.deck.length) return;
  if(!useBooster('swap')) return;
  const i=G.rack.findIndex(t=>t&&t.id===G.sel);const old=G.rack[i];
  const nt=G.deck.pop();G.deck.splice(Math.floor(rnd()*G.deck.length),0,old);
  G.rack[i]=nt;G.last=nt.id;G.sel=null;G.swapUsed=true;G.undo=[];snd('draw');save();render();
}

/* ================= bots ================= */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let botKey=null;
function schedBot(){
  const k=G.token+':'+(G.turnNo||0);
  if(botKey===k) return; botKey=k;
  setTimeout(()=>{botTurn().catch(e=>{console.error(e);});},0);
}
function canAddAny(t){return G.melds.some(m=>tryAddMeld(m,t,false))}
function botWantsDiscard(p,d,h){
  const P=G.players[p];h=h||hand(p);
  if(G.diff===0&&p!==0&&rnd()<.4) return false;
  if(!P.opened){
    const a=solveRuns(h).pts,b=solveRuns([...h,d]).pts;
    if(b>=101&&a<101) return true;
    const pa=pairsOf(h).length,pb=pairsOf([...h,d]).length;
    if(pb>=5&&pa<5&&a<101) return true;
    return false;
  }
  if(isWild(d)) return true;
  if(P.pairs){ return h.some(t=>!isWild(t)&&eff(t).c===eff(d).c&&eff(t).n===eff(d).n)||canAddAny(d); }
  if(canAddAny(d)) return true;
  const a=solveRuns(h),b=solveRuns([...h,d]);
  return b.melds.some(m=>m.some(t=>t.id===d.id))&&b.pts>a.pts;
}
function trimKeepOne(melds,handN,needPts){
  // ensure at least one tile stays in hand
  let used=melds.reduce((a,m)=>a+m.length,0);
  if(used<handN) return melds;
  // try remove a tile from end of a run longer than 3
  for(const m of melds){ if(m.length>3){ const v=validateMeld(m.slice(0,-1),false); if(v){ const out=melds.map(x=>x===m?v.tiles:x); if(!needPts||out.reduce((a,x)=>a+meldPts(x),0)>=needPts) return out; } } }
  const sorted=[...melds].sort((a,b)=>meldPts(a)-meldPts(b));
  const out=melds.filter(m=>m!==sorted[0]);
  if(!needPts||out.reduce((a,x)=>a+meldPts(x),0)>=needPts) return out;
  return null;
}
async function botTurn(){
  const tok=G.token;const p=G.turn;if(p===0||G.over) return;
  const P=G.players[p];
  const alive=()=>G&&tok===G.token&&!G.over&&G.turn===p&&screen==='game';
  render();
  await sleep(window.__fast?0:(G.mode==='time'?380:650)); if(!alive()) return;
  if(G.phase==='draw'){
    const prev=(p+3)%4;const pile=G.players[prev].discard;const d=pile[pile.length-1];
    if(d&&botWantsDiscard(p,d)){pile.pop();P.hand.push(d);G.taken=d.id;toast(`${NAMES[p]} أخذ الرمية ${d.c<0?'الجوكر':CN[d.c]+' '+d.n}`);}
    else{ if(!G.deck.length){endRound(null);return;} P.hand.push(G.deck.pop()); }
    G.phase='play';snd('draw');save();render();
    await sleep(window.__fast?0:(G.mode==='time'?300:550)); if(!alive()) return;
  }
  // play
  let laid=false;
  if(!P.opened){
    const sol=solveRuns(P.hand);
    let melds=sol.pts>=101?trimKeepOne(sol.melds,P.hand.length,101):null;
    if(melds&&(G.taken==null||melds.some(m=>m.some(t=>t.id===G.taken)))){
      layBot(p,melds,false);P.opened=true;laid=true;flash(`${NAMES[p]} نزل!`);
    }else{
      const pr=pairsOf(P.hand);
      const pairNeed=(G.deck.length<10||sol.pts>=80)?5:6;
      if(pr.length>=pairNeed){const sel=trimKeepOne(pr,P.hand.length,0);if(sel&&sel.length>=5){layBot(p,sel,true);P.opened=true;P.pairs=true;laid=true;flash(`${NAMES[p]} نزل أزواج`);}}
    }
  }else{
    if(P.pairs){const pr=pairsOf(P.hand);const sel=pr.length?trimKeepOne(pr,P.hand.length,0):null;if(sel&&sel.length){layBot(p,sel,true);laid=true;}}
    else{const sol=solveRuns(P.hand);const sel=sol.melds.length?trimKeepOne(sol.melds,P.hand.length,0):null;if(sel&&sel.length){layBot(p,sel,false);laid=true;}}
  }
  if(P.opened){
    let ch=true;
    while(ch&&P.hand.length>1){ch=false;
      for(const t of [...P.hand]){
        if(P.hand.length<=1) break;
        if(isWild(t)&&P.hand.length>3) continue;
        const m=G.melds.find(m=>tryAddMeld(m,t,true));
        if(m){P.hand.splice(P.hand.indexOf(t),1);applyAdd(m,t,true);ch=true;laid=true;}
      }
    }
  }
  if(laid){snd('lay');save();render();await sleep(window.__fast?0:(G.mode==='time'?300:600));if(!alive())return;}
  // discard
  const t=chooseDiscard(p,P.hand);
  P.hand.splice(P.hand.indexOf(t),1);P.discard.push(t);G.taken=null;snd('place');
  if(!P.hand.length){endRound(p,isWild(t));return;}
  nextTurn();
}
function layBot(p,melds,pairs){
  const P=G.players[p];
  melds.forEach(m=>{const v=validateMeld(m,pairs);if(!v)return;v.tiles.forEach(t=>P.hand.splice(P.hand.indexOf(t),1));G.melds.push({id:G.mid++,owner:p,type:v.type,tiles:v.tiles});});
  G.newMeld=G.mid-1;
}
function chooseDiscard(p,h){
  if(h.length===1) return h[0];
  const P=G.players[p];
  let cand=h.filter(t=>!isWild(t)&&t.id!==G.taken);
  if(!cand.length) cand=h.filter(t=>t.id!==G.taken);
  if(!cand.length) cand=h;
  let usedIds=new Set();
  if(P.pairs||(!P.opened&&pairsOf(h).length>=4&&solveRuns(h).pts<60)) usedIds=new Set(pairsOf(h).flat().map(t=>t.id));
  else usedIds=new Set(solveRuns(h).melds.flat().map(t=>t.id));
  let c1=cand.filter(t=>!usedIds.has(t.id)); if(!c1.length) c1=cand;
  if(p!==0&&G.diff===0&&rnd()<.35) return c1[Math.floor(rnd()*c1.length)];
  const next=G.players[(p+1)%4];
  let best=null,bs=-1e9;
  for(const t of c1){
    const e=eff(t);let u=0;
    for(const o of h){ if(o===t) continue; if(isWild(o)) continue; const eo=eff(o);
      if(eo.c===e.c&&Math.abs(eo.n-e.n)===1) u+=3; else if(eo.c===e.c&&Math.abs(eo.n-e.n)===2) u+=1.4;
      if(eo.n===e.n&&eo.c!==e.c) u+=2; if(eo.n===e.n&&eo.c===e.c) u+=(P.pairs||!P.opened)?2.5:.8; }
    if(P.opened&&canAddAny(t)) u+=6;
    let sc=-u*10+e.n;
    if((G.diff===2||p===0)&&next.opened&&canAddAny(t)) sc-=25;
    if(t.c<0) sc-=15;
    if(sc>bs){bs=sc;best=t;}
  }
  return best||c1[0];
}

/* ================= round end ================= */
function endRound(winner,okeyFinish){
  if(G.over) return;
  G.over=true;G.token++;stopTimer();
  const mult=(winner!=null&&okeyFinish)?2:1;
  const pen=[0,1,2,3].map(p=>{
    const P=G.players[p];
    if(p===winner) return -101*mult;
    if(!P.opened) return 202*mult;
    return hand(p).reduce((a,t)=>a+tval(t),0)*(P.pairs?2:1)*mult;
  });
  pen.forEach((v,i)=>G.totals[i]+=v);
  G.history.push(pen);
  G.roundResult={winner,okeyFinish,pen};
  if(winner===0){G.outs++;S.stats.outs++;}
  S.stats.rounds++;
  persist();
  if(winner===0){snd('win');buzz([30,60,30]);flash(okeyFinish?'خلّصت بالأوكي! ×2':'فزت بالجولة!');}
  else if(winner!=null){snd('lose');flash(`${NAMES[winner]} خلّص`);}
  else flash('خلصت الكومة');
  save();render();
  setTimeout(()=>showRoundModal(),1100);
}
function showRoundModal(){

function finishGame(){

  const rows=order.map((p,i)=>`<tr class="${p===0?'me':''}"><td>${i+1}</td><td class="nm">${NAMES[p]}</td><td dir="ltr"><b>${G.totals[p]}</b></td></tr>`).join('');
  const st=G.mode==='adventure'?`<div class="stars">${[1,2,3].map(i=>`<span class="${i<=stars?'on':''}">★</span>`).join('')}</div>`:'';
  modal(`<h2>${won?'مبروك! المركز الأول':place===2?'المركز الثاني':'المركز '+(place===3?'الثالث':'الرابع')}</h2>
   ${st}<div class="sub">${G.mode==='adventure'?'المستوى '+G.level+' · ':''}${S.streak>1?'سلسلة فوز ×'+S.streak+' · ':''}+${gems} جوهرة</div>${extra}
   <table class="res"><tr><th>#</th><th></th><th>النقاط</th></tr>${rows}</table>
   ${G.mode==='adventure'&&won?'<button class="btn" id="mA">المستوى التالي</button>':'<button class="btn" id="mA">العب مرة ثانية</button>'}
   <button class="btn alt" id="mH">الرئيسية</button>`,false);
  $('#mA').onclick=()=>{closeModal();const m=G.mode;newGame(m,{level:m==='adventure'?S.level:undefined});};

}

/* ================= time attack ================= */
setInterval(()=>{
  if(screen!=='game'||!G||G.over||document.querySelector('.modal')||document.hidden) return;
  G.elapsed=(G.elapsed||0)+1;
  if(!(G.mode==='time'&&myTurn())){const el=document.getElementById('clkT');if(el)el.textContent=fmtT(G.elapsed);}
},1000);
let timerI=null;
function stopTimer(){if(timerI){clearInterval(timerI);timerI=null;}}
function ensureTimer(){
  if(G&&G.mode==='time'&&myTurn()&&screen==='game'){
    if(!timerI) timerI=setInterval(()=>{
      if(!G||!myTurn()||screen==='game'&&document.querySelector('.modal')){return;}
      G.timeLeft--; const el=document.getElementById('clkT');
      if(el){el.textContent=fmtT(Math.max(0,G.timeLeft));$('#clk').classList.toggle('low',G.timeLeft<=7);}
      if(G.timeLeft<=5&&G.timeLeft>0) snd('tick');

    },1000);
  }else stopTimer();
}
function autoPlay(){
  stopTimer();
  if(G.phase==='draw') drawDeck();
  if(!myTurn()) return;
  if(G.taken!=null&&G.rack.some(t=>t&&t.id===G.taken)){bUndoFree();}
  if(G.phase==='draw') drawDeck();
  if(!myTurn()) return;
  const t=chooseDiscard(0,hand(0));toast('خلص الوقت! رمينا عنك');discard(t.id);
}

     <div class="brand"><small>SADU OKEY!</small><span>سدو أوكي</span></div>
     <div class="sbox"><small>مجموعك</small><b>${G.totals[0]}</b></div>
     <div class="sbox"><small>الأفضل</small><b>${S.best==null?'—':S.best}</b></div>
   </div>
   <div class="subrow">
     <button class="menubtn" id="gMenu" aria-label="القائمة">${ICO.menu}</button>
     <span class="info">الجولة <b>${G.round}/${G.rounds}</b> · الكومة <b>${G.deck.length}</b></span>
     <span class="pillx ${timeMode&&G.timeLeft<=7?'low':''}" id="clk">${ICO.timer}<span id="clkT">${timeMode?fmtT(G.timeLeft):fmtT(G.elapsed||0)}</span></span>
     <span class="gems"><span class="gem"></span><b>${S.gems}</b></span>
   </div>
   <div class="opps">${opp(3)}${opp(2)}${opp(1)}</div>
   <div class="board">
     <div class="table" id="table">${byOwner||'<div class="empty">الطاولة فاضية. أول نزول يحتاج 101 نقطة أو 5 أزواج</div>'}</div>
     <div class="center">
       <div class="pile ${canDraw&&leftTop?'active':''}" id="takePile2"><div class="slotbox">${leftTop?tileHTML(leftTop):''}</div><span>رمية ${NAMES[3]}</span></div>
       <div class="pile deck ${canDraw?'active':''}" id="deck"><div class="slotbox">${G.deck.length?(G.peek?tileHTML(G.deck[G.deck.length-1]):'<div class="tile back"></div>'):''}<span class="cnt">${G.deck.length}</span></div><span>الكومة</span></div>
       <div class="indic"><div class="lab">المؤشر</div>${tileHTML(G.ind)}<div class="lab">الأوكي<br><b>${CN[G.okC]} ${G.okN}</b></div></div>
       <div class="pile" id="myPile"><div class="slotbox">${myPileTop?tileHTML(myPileTop):''}</div><span>رميتك</span></div>
     </div>
   </div>
   <div class="status">
     ${!P0.opened?`<span>نقاطك: <b class="${st.pts>=101?'good':''}">${st.pts}</b> · الهدف: <b>101</b> · أزواج: <b class="${st.prs.length>=5?'good':''}">${st.prs.length}/5</b></span>`:`<span><b class="good">${P0.pairs?'نازل أزواج':'نازل'}</b></span>`}
     ${msg?`<span class="msg">${msg}</span>`:''}
   </div>
   <div class="actions">
     <button class="act light" id="a123">123</button><button class="act light" id="a77">77</button>
     <button class="act red" id="aLay" ${myTurn()&&G.phase==='play'?'':'disabled'}>${P0.opened?'نزّل':'انزل'}</button>
     <button class="act dark" id="aDis" ${myTurn()&&G.phase==='play'?'':'disabled'}>ارمِ</button>
   </div>
   <div class="boost">
     <button class="bst" id="bU" ${myTurn()?'':'disabled'}><b>ترجيع</b><small>${bl('undo')}</small></button>
     <button class="bst" id="bH" ${myTurn()?'':'disabled'}><b>تلميح</b><small>${bl('hint')}</small></button>
     <button class="bst" id="bP" ${myTurn()&&G.phase==='draw'?'':'disabled'}><b>كشف</b><small>${bl('peek')}</small></button>
     <button class="bst" id="bS" ${myTurn()&&G.phase==='play'?'':'disabled'}><b>تبديل</b><small>${bl('swap')}</small></button>
   </div>
   <div class="rack ${myTurn()?'myturn':''}" id="rack">${[0,1].map(r=>`<div class="rrow">${Array.from({length:13},(_,c)=>{const i=r*13+c;const t=G.rack[i];
      const cls=[t&&okGroups.has(t.id)?'ok':'',t&&G.sel===t.id?'sel':'',t&&G.last===t.id?'newt':'',t&&G.hintId===t.id?'hint':''].join(' ');
      return `<div class="slot" data-slot="${i}">${t?tileHTML(t,cls):''}</div>`}).join('')}</div>`).join('')}</div>
  </div>`;
  G.last=null;G.hintId=null;
  bindGame();
  ensureTimer();
}
function bindGame(){
  $('#gMenu').onclick=()=>{snd('tap');menuModal();};
  $('#deck').onclick=()=>drawDeck();
  const tp=()=>takeDiscard();
  $('#takePile2').onclick=tp; const t3=$('#takePile'); if(t3) t3.onclick=tp;
  $('#myPile').onclick=()=>{if(G.sel!=null)discard(G.sel);};
  $('#a123').onclick=()=>{arrangeTiles(hand(0),'123');snd('tap');save();render();};
  $('#a77').onclick=()=>{arrangeTiles(hand(0),'77');snd('tap');save();render();};
  $('#aLay').onclick=layRack;
  $('#aDis').onclick=()=>discard(G.sel);
  $('#bU').onclick=bUndo;$('#bH').onclick=bHint;$('#bP').onclick=bPeek;$('#bS').onclick=bSwap;
  document.querySelectorAll('.meld').forEach(m=>m.onclick=()=>{if(G.sel!=null)addToMeld(G.sel,+m.dataset.mid);else if(myTurn()&&G.players[0].opened)toast('اختر حجر من حاملك أول، بعدين اضغط على النزول');});
  document.querySelectorAll('.slot').forEach(s=>s.addEventListener('click',e=>{if(e.target.closest('.tile'))return;if(G.sel!=null){moveToSlot(G.sel,+s.dataset.slot);G.sel=null;snd('place');save();render();}}));
  const tb=$('#table');if(tb&&G.newMeld){const el=tb.querySelector(`[data-mid="${G.newMeld}"]`);if(el)el.scrollIntoView({block:'nearest'});}
}
/* drag & tap on rack */
let drag=null;
document.addEventListener('pointerdown',e=>{
  if(screen!=='game'||!G) return;
  const el=e.target.closest('.rack .tile'); if(!el) return;
  e.preventDefault();
  drag={id:+el.dataset.id,x:e.clientX,y:e.clientY,el,moved:false,ghost:null,hot:null};
});
document.addEventListener('pointermove',e=>{
  if(!drag) return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6){
    drag.moved=true;drag.ghost=drag.el.cloneNode(true);drag.ghost.classList.remove('sel','ok','newt');drag.ghost.classList.add('ghost');
    document.body.appendChild(drag.ghost);drag.el.classList.add('dragging');
  }
  if(drag.moved){
    drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
    const under=document.elementFromPoint(e.clientX,e.clientY);
    document.querySelectorAll('.meld.target,.slot.hot').forEach(x=>x.classList.remove('target','hot'));
    const m=under&&under.closest('.meld');if(m)m.classList.add('target');
    const s=under&&under.closest('.slot');if(s)s.classList.add('hot');
  }
});
document.addEventListener('pointerup',e=>{
  if(!drag) return; const d=drag; drag=null;
  if(d.moved){
    d.ghost.remove();
    const under=document.elementFromPoint(e.clientX,e.clientY);
    const slot=under&&under.closest('[data-slot]'),meld=under&&under.closest('.meld'),pile=under&&under.closest('#myPile');
    if(slot){moveToSlot(d.id,+slot.dataset.slot);snd('place');save();render();}
    else if(meld){addToMeld(d.id,+meld.dataset.mid);render();}
    else if(pile){discard(d.id);}
    else render();
  }else{
    G.sel=G.sel===d.id?null:d.id;snd('tap');render();
  }
});
document.addEventListener('pointercancel',()=>{if(drag){if(drag.ghost)drag.ghost.remove();drag=null;render();}});

function render(){
  if(screen==='game'&&G) renderGame(); else {screen='home';renderHome();}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
// expose for tests
window.__sadu={get G(){return G},set G(v){G=v},validateMeld,solveRuns,pairsOf,newGame,startRound,drawDeck,discard,layRack,chooseDiscard,hand,arrangeTiles,addToMeld,takeDiscard,endRound,get screen(){return screen},set screen(v){screen=v},render,rackStatus};
render();
let seen=true;try{seen=!!localStorage.getItem('sadu101.seen');localStorage.setItem('sadu101.seen','1')}catch(e){}
if(!seen)setTimeout(()=>howTo(0),300);
})();
</script>
