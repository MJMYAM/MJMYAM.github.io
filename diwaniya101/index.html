<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ديوانية 101</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="ديوانية 101 — أوكي 101 على الزولية: رتّب حجارك، انزل بـ101، وخلّص قبل الكل.">
<meta name="theme-color" content="#5b1420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: the phone is the diwaniya floor — a madder carpet with a medallion, ivory bone tiles, a two-tier walnut rack at your knees */
:root{
  --t0:#c0262d; --t1:#d98510; --t2:#1f5bb0; --t3:#201d1b;          /* engraved number inks */
  --bone:#f4ecda; --bone2:#e3d5b6; --bone-edge:#b7a27a;            /* tile body */
  --carpet:#5b1420; --carpet-dk:#350912; --motif:#7b2433; --motif2:#24305a; --fringe:#efe2c4;
  --wood:#7a4520; --wood-lt:#a06232; --wood-dk:#3e200c;
  --brass:#d6aa4f; --brass-dk:#8d6a22;
  --ink:#f7eedc; --mut:#dcc3a8; --panel:rgba(22,6,10,.42); --panel-line:rgba(214,170,79,.38);
  --plaque:#f4ecda; --plaque-ink:#2b1c14; --plaque-mut:#7b6450;
  --ok:#3fae5f;
  --display:"Reem Kufi","Readex Pro",system-ui,sans-serif;
  --body:"Readex Pro","Segoe UI",Tahoma,sans-serif;
  --tw:30px; --mw:20px;
  color-scheme:dark;
}
:root[data-theme="indigo"]{--carpet:#1c2748;--carpet-dk:#0e1530;--motif:#2c3a68;--motif2:#7b2433;--panel:rgba(5,8,22,.45)}
:root[data-theme="green"]{--carpet:#1e3b2c;--carpet-dk:#0f2219;--motif:#2c513d;--motif2:#7b2433;--panel:rgba(4,14,9,.42)}
:root[data-theme="day"]{--carpet:#e9dcc0;--carpet-dk:#d8c7a3;--motif:#dccaa5;--motif2:#b9a27a;--fringe:#5b1420;--ink:#2b1c14;--mut:#6f5844;--panel:rgba(255,250,238,.6);--panel-line:rgba(141,106,34,.35);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{color:var(--ink);font-family:var(--body);user-select:none;-webkit-user-select:none;overscroll-behavior:none;background-color:var(--carpet-dk);
  background-image:
    radial-gradient(circle at 50% 50%,transparent 0 3px,var(--motif) 3px 4px,transparent 4px) 0 0/22px 22px,
    linear-gradient(45deg,transparent 47%,rgba(0,0,0,.12) 47% 53%,transparent 53%) 0 0/22px 22px,
    linear-gradient(-45deg,transparent 47%,rgba(0,0,0,.12) 47% 53%,transparent 53%) 0 0/22px 22px,
    linear-gradient(var(--carpet),var(--carpet))}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* carpet border band: fringe + guard stripes + diamond chain */
.band{height:24px;flex:none;position:relative;background:
  conic-gradient(from 45deg at 50% 50%,var(--fringe) 0 25%,transparent 0 50%,var(--fringe) 0 75%,transparent 0) 50% 50%/16px 16px,
  linear-gradient(var(--motif2),var(--motif2));
  border-top:3px solid var(--brass);border-bottom:3px solid var(--brass);
  box-shadow:inset 0 3px 0 var(--carpet-dk),inset 0 -3px 0 var(--carpet-dk)}
.band::after{content:"";position:absolute;inset:6px 0;background:radial-gradient(circle,var(--t0) 2px,transparent 2.5px) 0 50%/16px 100% repeat-x}
.band.thin{height:16px}.band.thin::after{inset:3px 0}

/* ---------- shared ---------- */
.cups{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--panel-line);border-radius:99px;padding:4px 5px 4px 12px;font:600 17px/1 var(--body);direction:ltr;font-variant-numeric:tabular-nums}
.cups svg{width:20px;height:20px;fill:var(--brass)}
.cups .plus{width:28px;height:28px;border-radius:50%;background:var(--brass);color:#2b1c14;font:700 19px/28px var(--body);text-align:center}
.ico{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.medal{position:absolute;inset:0;pointer-events:none;opacity:.32;
  background:radial-gradient(ellipse 46% 34% at 50% 50%,transparent 0 58%,var(--motif2) 58% 61%,transparent 61% 66%,var(--motif) 66% 72%,transparent 72%),
             radial-gradient(ellipse 22% 16% at 50% 50%,var(--motif) 0 40%,transparent 41% 55%,var(--motif2) 55% 62%,transparent 63%)}

/* ---------- TILES: ivory bone, engraved numerals ---------- */
.tile{--ti:var(--t3);width:var(--tw);height:calc(var(--tw)*1.36);border-radius:calc(var(--tw)*.14);flex:none;position:relative;
  background:linear-gradient(180deg,#fffaf0 0%,var(--bone) 55%,var(--bone2) 100%);
  box-shadow:0 calc(var(--tw)*.08) 0 var(--bone-edge),0 calc(var(--tw)*.12) calc(var(--tw)*.16) rgba(0,0,0,.38),inset 0 1px 0 #fff;
  display:flex;flex-direction:column;align-items:center;padding-top:calc(var(--tw)*.1);transition:transform .15s,box-shadow .15s;touch-action:none}
.tile b{font:700 calc(var(--tw)*.58)/1 var(--body);color:var(--ti);letter-spacing:-.5px;text-shadow:0 1px 0 rgba(255,255,255,.9),0 -1px 0 rgba(0,0,0,.18)}
.tile i{position:absolute;bottom:calc(var(--tw)*.17);width:calc(var(--tw)*.3);height:calc(var(--tw)*.16);border-radius:0 0 99px 99px;background:var(--ti);opacity:.85}
.tile i::after{content:"";position:absolute;left:50%;top:-55%;width:42%;height:70%;transform:translateX(-50%);border-radius:50%;background:var(--bone)}
.tile.c0{--ti:var(--t0)}.tile.c1{--ti:var(--t1)}.tile.c2{--ti:var(--t2)}.tile.c3{--ti:var(--t3)}
.tile .fj{font:400 calc(var(--tw)*.62)/1 var(--body);background:linear-gradient(90deg,var(--t0) 50%,var(--t2) 50%);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:calc(var(--tw)*.04)}
.tile.fake i{background:linear-gradient(90deg,var(--t0) 50%,var(--t2) 50%)}
.tile s{position:absolute;top:-5px;left:-5px;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe7a3,var(--brass) 55%,var(--brass-dk));color:#3d2a05;font:700 9px/15px var(--body);text-decoration:none;text-align:center;z-index:3;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.tile.back{background:linear-gradient(180deg,#fffaf0,var(--bone2))}
.tile.back::after{content:"";position:absolute;inset:18% 20%;border:1.5px solid var(--bone-edge);border-radius:3px;background:radial-gradient(circle,var(--motif) 22%,transparent 24%) 50% 50%/8px 8px}
.mini{--tw:var(--mw)}
.mini s{width:11px;height:11px;font-size:7px;line-height:11px;top:-4px;left:-4px}

/* ---------- HOME ---------- */
.home{flex:1;overflow-y:auto;position:relative;padding-block:14px 22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.home>*{position:relative}
.toprow{display:flex;justify-content:space-between;align-items:center}
.lv{font:600 14px var(--body);color:var(--mut)}
.hero{display:flex;flex-direction:column;align-items:center;gap:4px;margin:10px 0 6px}
.minirack{position:relative;padding:0 14px 16px;display:flex;gap:6px;direction:ltr}
.minirack::after{content:"";position:absolute;left:0;right:0;bottom:0;height:20px;border-radius:4px 4px 8px 8px;
  background:linear-gradient(180deg,var(--wood-lt),var(--wood) 45%,var(--wood-dk));box-shadow:0 8px 16px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.25)}
.minirack .tile{--tw:58px;z-index:1}
.minirack .tile:nth-child(1){transform:rotate(-3deg)}.minirack .tile:nth-child(3){transform:rotate(3deg)}
.name{font:700 50px/1.05 var(--display);margin:12px 0 0;text-shadow:0 3px 0 rgba(0,0,0,.35);letter-spacing:.5px}
.name span{color:var(--brass)}
.tag{font:500 16px var(--body);color:var(--mut);text-align:center;text-wrap:balance}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:start;border-radius:16px;padding:12px 14px;position:relative;
  background:linear-gradient(180deg,#fffaf0,var(--plaque));color:var(--plaque-ink);
  box-shadow:0 5px 0 var(--bone-edge),0 10px 20px rgba(0,0,0,.35);transition:transform .12s}
.mode:active{transform:translateY(3px);box-shadow:0 2px 0 var(--bone-edge),0 6px 12px rgba(0,0,0,.3)}
.mode .pip{width:46px;height:58px;flex:none;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:linear-gradient(180deg,#fff,var(--bone2));box-shadow:inset 0 0 0 1px var(--bone-edge);font:700 24px/1 var(--body)}
.mode .pip i{width:14px;height:7px;border-radius:0 0 9px 9px;background:currentColor}
.mode b{display:block;font:700 22px/1.2 var(--display)}
.mode small{display:block;font:500 14px/1.35 var(--body);color:var(--plaque-mut)}
.mode .go{margin-inline-start:auto;font:600 13px var(--body);color:var(--plaque-mut);white-space:nowrap}
.mode.hl{box-shadow:0 0 0 3px var(--brass),0 5px 0 var(--bone-edge),0 10px 20px rgba(0,0,0,.35)}
.mode .new{color:var(--t0);font-weight:700}
.links{display:flex;justify-content:center;gap:4px 18px;flex-wrap:wrap;margin-top:4px}
.links button{font:600 15px var(--body);color:var(--ink);padding:6px 2px;border-bottom:2px solid var(--brass)}

/* ---------- GAME ---------- */
.game{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.ghead{display:flex;align-items:center;gap:8px;padding-top:8px}
.rbtn{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#2b1c14;
  background:radial-gradient(circle at 35% 30%,#ffe7a3,var(--brass) 55%,var(--brass-dk));box-shadow:0 2px 4px rgba(0,0,0,.4)}
.rbtn .ico{width:20px;height:20px}
.gmid{flex:1;min-width:0;line-height:1.2}
.gmid b{display:block;font:700 18px var(--display)}
.gmid small{font:500 12px var(--body);color:var(--mut)}
.plaque{background:linear-gradient(180deg,#fffaf0,var(--plaque));color:var(--plaque-ink);border-radius:10px;padding:3px 12px;text-align:center;line-height:1.1;box-shadow:0 3px 0 var(--bone-edge),0 0 0 2px var(--brass)}
.plaque small{display:block;font:500 10px var(--body);color:var(--plaque-mut)}
.plaque b{font:700 20px var(--body);direction:ltr;display:block;font-variant-numeric:tabular-nums}
.subrow{display:flex;align-items:center;gap:8px;padding:8px 0 6px}
.subrow .grow{flex:1}
.pillx{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--panel-line);border-radius:99px;padding:3px 11px;font:600 14px var(--body);direction:ltr;font-variant-numeric:tabular-nums}
.pillx .ico{width:16px;height:16px}
.pillx.low{background:var(--t0);border-color:transparent;color:#fff}
.subrow .cups{font-size:14px;padding:3px 10px}
.subrow .cups svg{width:17px;height:17px}
.opps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opp{background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:6px 6px 6px 4px;display:flex;align-items:center;gap:6px;position:relative;min-width:0;transition:box-shadow .2s}
.opp.turn{box-shadow:0 0 0 2px var(--brass),0 0 16px rgba(214,170,79,.4)}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 15px var(--display);color:#fff;padding:2px;
  background:radial-gradient(circle at 35% 30%,#ffe7a3,var(--brass) 55%,var(--brass-dk))}
.av span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--c)}
.opp .info{flex:1;min-width:0;line-height:1.25;padding-left:calc(var(--mw) + 4px)}
.opp .nm{font:600 13px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp .meta{font:500 11px var(--body);color:var(--mut);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.opp .meta b{color:var(--ink);direction:ltr;font-weight:600}
.badge{background:var(--ok);color:#fff;border-radius:6px;padding:0 5px;font:600 10px/16px var(--body)}
.badge.pr{background:var(--t2)}
.opp .dis{position:absolute;left:5px;top:6px;min-width:var(--mw);height:calc(var(--mw)*1.36);border-radius:5px;border:1px dashed var(--panel-line)}
.opp .dis.take{border:2px solid var(--brass);border-radius:6px;animation:pulse 1.2s infinite}
.thinking{display:inline-block;animation:blink 1s infinite;color:var(--brass)}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(214,170,79,.35)}}
@keyframes blink{50%{opacity:.3}}
.board{position:relative;margin-top:8px;flex:1;min-height:80px;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;
  border:2px solid var(--panel-line);box-shadow:inset 0 0 0 5px var(--carpet-dk),inset 0 0 0 7px var(--brass-dk),inset 0 0 40px rgba(0,0,0,.35)}
.table{flex:1;overflow-y:auto;padding:12px 12px 6px;direction:ltr;min-height:0;position:relative}
.table .empty{direction:rtl;text-align:center;color:var(--mut);font:500 14px var(--body);margin-top:16px;text-wrap:balance}
.mrow{display:flex;flex-wrap:wrap;gap:6px 9px;align-items:center;margin-bottom:6px;position:relative}
.mrow .who{direction:rtl;font:600 11px var(--body);color:var(--ink);background:var(--panel);padding:1px 8px;border-radius:8px}
.meld{display:flex;gap:2px;padding:3px;border-radius:7px;border:2px solid transparent;transition:border-color .15s,background .15s}
.meld.target{border-color:var(--brass);background:rgba(214,170,79,.25)}
.meld.newm{animation:pop .35s}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.center{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;padding:6px 12px 12px;position:relative}
.pile{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 11px var(--body);color:var(--mut);min-width:54px}
.pile .slotbox{--tw:32px;width:var(--tw);height:calc(var(--tw)*1.36);border-radius:6px;border:2px dashed var(--panel-line);display:grid;place-items:center;position:relative}
.pile .slotbox .tile{--tw:32px}
.pile.active .slotbox,.pile.active .stacks{animation:pulse 1.2s infinite;border-radius:8px}
.stacks{display:flex;gap:4px;align-items:flex-end;height:46px;padding:0 3px;position:relative}
.stk{width:24px;position:relative}
.stk i{display:block;width:24px;height:7px;margin-top:-1px;border-radius:2px;background:linear-gradient(180deg,#fffaf0,var(--bone2));box-shadow:0 1px 0 var(--bone-edge),0 2px 3px rgba(0,0,0,.3)}
.stk.peek{width:30px}
.stk.peek .tile{--tw:30px}
.stacks .cnt{position:absolute;top:-8px;right:-10px;background:var(--brass);color:#2b1c14;border-radius:8px;font:700 11px/16px var(--body);padding:0 5px;z-index:3}
.indic{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:5px 8px}
.indic .lab{font:500 10px/1.3 var(--body);color:var(--mut);text-align:center}
.indic .lab b{color:var(--ink);font-size:13px;font-weight:600}
.indic .tile{--tw:26px}
.status{display:flex;gap:8px;align-items:center;padding:8px 2px 2px;font:500 13px var(--body);color:var(--mut);flex-wrap:wrap}
.status b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.status b.good{color:var(--ok)}
.status .msg{margin-inline-start:auto;color:var(--ink);font-weight:600}
.actions{display:flex;gap:6px;padding-top:6px}
.act{flex:1;height:46px;border-radius:12px;font:700 18px var(--display);display:flex;align-items:center;justify-content:center}
.act:active{transform:translateY(2px)}
.act.lay{background:radial-gradient(ellipse at 50% 20%,#ffe7a3,var(--brass) 60%,var(--brass-dk));color:#2b1c14;box-shadow:0 4px 0 #5f4610}
.act.dis{background:var(--t0);color:#fff;box-shadow:0 4px 0 #6d1116}
.act.bone{flex:none;width:58px;background:linear-gradient(180deg,#fffaf0,var(--bone2));color:var(--plaque-ink);box-shadow:0 4px 0 var(--bone-edge);direction:ltr;font:700 16px var(--body)}
.act[disabled]{opacity:.4;pointer-events:none}
.boost{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-top:9px}
.bst{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:4px 2px;line-height:1.2}
.bst b{display:block;font:600 14px var(--body)}
.bst small{font:500 10px var(--body);color:var(--mut)}
.bst[disabled]{opacity:.4;pointer-events:none}
/* the walnut rack, two ledges like a real okey istaka */
.rack{flex:none;position:relative;margin-top:10px;padding:8px 8px 6px;direction:ltr;border-radius:12px 12px 0 0;
  background:repeating-linear-gradient(92deg,rgba(255,255,255,.04) 0 2px,transparent 2px 9px,rgba(0,0,0,.06) 9px 11px,transparent 11px 17px),linear-gradient(180deg,var(--wood-lt),var(--wood) 40%,var(--wood-dk));
  box-shadow:0 -6px 18px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.25)}
.rack::before,.rack::after{content:"";position:absolute;top:6px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe7a3,var(--brass) 55%,var(--brass-dk))}
.rack::before{left:6px}.rack::after{right:6px}
.rack.myturn{box-shadow:0 -6px 18px rgba(0,0,0,.45),0 -3px 0 2px var(--brass),inset 0 2px 0 rgba(255,255,255,.25)}
.rrow{display:grid;grid-template-columns:repeat(13,var(--tw));gap:3px;justify-content:center;padding:4px 0 7px;position:relative}
.rrow::after{content:"";position:absolute;left:-8px;right:-8px;bottom:0;height:7px;background:linear-gradient(180deg,var(--wood-dk),#2a1407);box-shadow:0 2px 0 rgba(255,255,255,.18)}
.rrow+.rrow{margin-top:5px}
.slot{width:var(--tw);height:calc(var(--tw)*1.36);border-radius:calc(var(--tw)*.14);position:relative;z-index:1}
.slot.hot{background:rgba(255,231,163,.3)}
.slot .tile.ok{box-shadow:0 calc(var(--tw)*.08) 0 var(--bone-edge),0 0 0 2px var(--ok),0 0 9px var(--ok)}
.slot .tile.sel{transform:translateY(-8px);box-shadow:0 calc(var(--tw)*.08) 0 var(--bone-edge),0 0 0 2px var(--brass),0 8px 12px rgba(0,0,0,.45)}
.slot .tile.newt{animation:drop .4s}
.slot .tile.hint{animation:hintg 1s 3}
@keyframes hintg{50%{box-shadow:0 0 0 3px var(--brass),0 0 14px var(--brass)}}
@keyframes drop{0%{transform:translateY(-30px);opacity:0}}
.tile.dragging{opacity:.25}
.ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-60%) scale(1.15) rotate(-3deg)}
.toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);background:#1c1412;color:#f7eedc;border:1px solid var(--brass);padding:10px 16px;border-radius:12px;font:500 14px var(--body);z-index:1000;box-shadow:0 8px 20px rgba(0,0,0,.4);max-width:88vw;text-align:center;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}
.flash{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:50;font:700 34px var(--display);color:#2b1c14;padding:8px 26px;border-radius:14px;
  background:linear-gradient(180deg,#fffaf0,var(--bone));box-shadow:0 0 0 3px var(--brass),0 12px 30px rgba(0,0,0,.45);animation:fl 1.2s forwards;pointer-events:none;white-space:nowrap}
@keyframes fl{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}20%{transform:translate(-50%,-50%) scale(1.06);opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-75%)}}
/* sheets: an ivory card on the carpet */
.modal{position:fixed;inset:0;background:rgba(10,4,6,.6);z-index:500;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:linear-gradient(180deg,#fffaf0,var(--plaque));color:var(--plaque-ink);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;border-top:4px solid var(--brass);

<body>
<div class="app" id="app"></div>
<script>
(()=>{
'use strict';
/* ================= persistence ================= */
const LS='diwaniya101.v1';
const defaults=()=>({gems:150,theme:'madder',sound:true,vib:true,level:1,stars:{},streak:0,best:null,
  stats:{games:0,wins:0,outs:0,rounds:0},daily:{},gift:'',save:null,diff:1,rounds:3});
let S;
try{S=Object.assign(defaults(),JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){S=defaults()}
const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
if(!['madder','indigo','green','day'].includes(S.theme))S.theme='madder';
document.documentElement.dataset.theme=S.theme;

/* ================= sound ================= */
let AC=null;
function snd(k){
  if(!S.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const seq={tap:[[700,.04,'triangle',.08]],place:[[260,.05,'square',.05],[180,.05,'square',.04]],draw:[[420,.06,'triangle',.08]],
      lay:[[523,.09,'sine',.12],[659,.09,'sine',.12],[784,.14,'sine',.12]],err:[[150,.16,'sawtooth',.06]],
      win:[[523,.12,'sine',.14],[659,.12,'sine',.14],[784,.12,'sine',.14],[1046,.3,'sine',.14]],
      lose:[[392,.15,'sine',.1],[330,.15,'sine',.1],[262,.3,'sine',.1]],coin:[[988,.06,'square',.05],[1318,.12,'square',.05]],tick:[[1200,.03,'square',.04]]}[k]||[];
    let t=AC.currentTime;
    seq.forEach(([f,d,type,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.8;});
  }catch(e){}
}
const buzz=ms=>{if(S.vib&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}};

/* ================= rng ================= */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=Math.random;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ================= core model ================= */
const CN=['أحمر','أصفر','أزرق','أسود'];
const NAMES=['أنت','بو سالم','بو ناصر','بو فهد'];
const AVI=['أ','س','ن','ف'];
const MODEN={adventure:'المغامرة',classic:'قعدة ديوانية',daily:'تحدي اليوم',time:'على السريع'};
const AVC=['#c0262d','#1f5bb0','#2f6b45','#9a5a1c'];
const DIFFN=['سهل','عادي','صعب'];
let G=null;               // current game
const isWild=t=>t&&t.c>=0&&t.c===G.okC&&t.n===G.okN;
function eff(t){ if(t.c<0) return {c:G.okC,n:G.okN,w:false}; if(isWild(t)) return {c:t.c,n:t.n,w:true}; return {c:t.c,n:t.n,w:false}; }
const tval=t=>eff(t).n;

/* validate a set of tiles as a meld. returns {type,pts,tiles(ordered)} or null */
function validateMeld(tiles,allowPair=true){
  const ws=[],nat=[];
  tiles.forEach(t=>{const e=eff(t); if(e.w) ws.push(t); else nat.push({t,c:e.c,n:e.n});});
  const L=tiles.length;
  if(L===2){
    if(!allowPair) return null;
    if(ws.length>=1||(nat[0].c===nat[1].c&&nat[0].n===nat[1].n)){
      const n=nat.length?nat[0].n:G.okN; return {type:'pair',pts:n*2,tiles:[...nat.map(x=>x.t),...ws]};
    }
    return null;
  }
  if(L<3||L>13||nat.length===0) return null;
  // group
  if(L<=4){
    const n=nat[0].n;
    if(nat.every(x=>x.n===n)&&new Set(nat.map(x=>x.c)).size===nat.length){
      const ord=[...nat].sort((a,b)=>a.c-b.c).map(x=>x.t);
      return {type:'group',pts:n*L,tiles:[...ord,...ws]};
    }
  }
  // run
  const c=nat[0].c; if(!nat.every(x=>x.c===c)) return null;
  const hasOne=nat.some(x=>x.n===1);
  const modes=hasOne?[false,true]:[null];
  let best=null;
  for(const high of modes){
    const vs=nat.map(x=>({t:x.t,v:(high&&x.n===1)?14:x.n})).sort((a,b)=>a.v-b.v);
    let dup=false; for(let i=1;i<vs.length;i++) if(vs[i].v===vs[i-1].v) dup=true;
    if(dup) continue;
    const minB=high===true?2:1, maxB=high===false?13:14;
    const lo=vs[0].v, hi=vs[vs.length-1].v;
    const gaps=(hi-lo+1)-vs.length; if(gaps>ws.length) continue;
    const extra=ws.length-gaps; const top=Math.min(extra,maxB-hi); const bot=extra-top;
    if(lo-bot<minB) continue;
    const ord=[];let wi=0;const map=new Map(vs.map(x=>[x.v,x.t]));let pts=0;
    for(let v=lo-bot;v<=hi+top;v++){ ord.push(map.has(v)?map.get(v):ws[wi++]); pts+=v; }
    if(!best||pts>best.pts) best={type:'run',pts,tiles:ord};
  }
  return best;
}

/* ---- solver: best set of runs/groups (max points) ---- */
function solveRuns(tiles){
  const buckets=Array.from({length:52},()=>[]);const wilds=[];
  tiles.forEach(t=>{const e=eff(t); if(e.w) wilds.push(t); else buckets[e.c*13+e.n-1].push(t);});
  const cnt=buckets.map(b=>b.length); let w=wilds.length;
  const memo=new Map();
  const key=()=>cnt.join('')+'|'+w; // counts 0..2 single digit (fake jokers may make 3)
  function opts(i){
    const c=Math.floor(i/13),n=i%13+1,res=[];
    // groups
    const others=[0,1,2,3].filter(cc=>cc!==c&&cnt[cc*13+n-1]>0);
    for(let m=0;m<(1<<others.length);m++){
      const ks=[i];others.forEach((cc,j)=>{if(m&(1<<j)) ks.push(cc*13+n-1)});
      for(let wk=0;wk<=Math.min(w,2);wk++){const L=ks.length+wk; if(L>=3&&L<=4) res.push({ks,wk,pts:n*L});}
    }
    // runs
    for(const pv of (n===1?[1,14]:[n])){
      for(let s=Math.max(pv===14?2:1,pv-12);s<=pv;s++){
        if(pv===1&&s!==1) continue;
        let wk=0;const ks=[];let pts=0;let ok=true;
        for(let e=s;e<=Math.min(s+12,pv===1?13:14);e++){
          if(e===pv) ks.push(i);
          else{const kv=c*13+((e===14?1:e)-1); if(kv!==i&&cnt[kv]>0) ks.push(kv); else wk++;}
          pts+=e;
          if(wk>w){ok=false;break;}
          if(e>=pv&&e-s+1>=3) res.push({ks:[...ks],wk,pts});
        }
      }
    }
    return res;
  }
  function rec(){
    const i=cnt.findIndex(x=>x>0); if(i<0) return 0;
    const k=key(); if(memo.has(k)) return memo.get(k);
    cnt[i]--; let best=rec(); cnt[i]++;
    for(const o of opts(i)){
      o.ks.forEach(x=>cnt[x]--); w-=o.wk;
      const v=o.pts*100+o.ks.length+o.wk+rec();
      o.ks.forEach(x=>cnt[x]++); w+=o.wk;
      if(v>best) best=v;
    }
    memo.set(k,best); return best;
  }
  rec();
  // reconstruct
  const melds=[],rest=[];const bk=buckets.map(b=>[...b]);const wl=[...wilds];
  while(true){
    const i=cnt.findIndex(x=>x>0); if(i<0) break;
    const target=rec();
    cnt[i]--; const skip=rec(); cnt[i]++;
    if(skip===target){ cnt[i]--; rest.push(bk[i].pop()); continue; }
    let done=false;
    for(const o of opts(i)){
      o.ks.forEach(x=>cnt[x]--); w-=o.wk;
      const v=o.pts*100+o.ks.length+o.wk+rec();
      if(v===target){ melds.push([...o.ks.map(x=>bk[x].pop()),...wl.splice(0,o.wk)]); done=true; break; }
      o.ks.forEach(x=>cnt[x]++); w+=o.wk;
    }
    if(!done){ cnt[i]--; rest.push(bk[i].pop()); }
  }
  rest.push(...wl);
  const vm=melds.map(m=>validateMeld(m,false)).filter(Boolean);
  // any meld that failed validation goes back to rest (safety)
  const used=new Set(vm.flatMap(v=>v.tiles.map(t=>t.id)));
  const rest2=tiles.filter(t=>!used.has(t.id));
  return {melds:vm.map(v=>v.tiles),pts:vm.reduce((a,v)=>a+v.pts,0),rest:rest2};
}
function pairsOf(tiles){
  const map=new Map();const wl=[];
  tiles.forEach(t=>{const e=eff(t); if(e.w){wl.push(t);return;} const k=e.c*13+e.n; if(!map.has(k)) map.set(k,[]); map.get(k).push(t);});
  const pairs=[],singles=[];
  map.forEach(a=>{while(a.length>=2) pairs.push([a.pop(),a.pop()]); if(a.length) singles.push(a[0]);});
  singles.sort((a,b)=>tval(b)-tval(a));
  while(wl.length&&singles.length) pairs.push([singles.shift(),wl.pop()]);
  if(wl.length===2) pairs.push([wl.pop(),wl.pop()]);
  return pairs;
}
const meldPts=m=>{const v=validateMeld(m.tiles||m);return v?v.pts:0};

/* ================= game setup ================= */
function makeTiles(){const t=[];let id=1;for(let k=0;k<2;k++)for(let c=0;c<4;c++)for(let n=1;n<=13;n++)t.push({id:id++,c,n});t.push({id:id++,c:-1,n:0},{id:id++,c:-1,n:0});return t;}
function newGame(mode,opt={}){
  const lv=opt.level||S.level;
  const cfg={
    adventure:{rounds:lv<6?1:lv<16?2:3,diff:lv<=3?0:lv<=12?1:2},
    classic:{rounds:S.rounds,diff:S.diff},
    daily:{rounds:1,diff:1},
    time:{rounds:1,diff:1}
  }[mode];
  G={mode,level:lv,rounds:cfg.rounds,diff:cfg.diff,round:0,totals:[0,0,0,0],history:[],
    seed:mode==='daily'?hashStr(today()):Math.floor(Math.random()*1e9),
    startOff:mode==='daily'?0:Math.floor(Math.random()*4),
    boosters:{undo:2,hint:2,peek:1,swap:1},outs:0};
  startRound();
}
function hashStr(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function startRound(){
  G.round++;
  rnd=G.mode==='daily'?mulberry(G.seed+G.round*7919):Math.random;
  const tiles=shuffle(makeTiles());
  let ii=tiles.findIndex(t=>t.c>=0);
  G.ind=tiles.splice(ii,1)[0];
  G.okC=G.ind.c; G.okN=G.ind.n%13+1;
  G.starter=(G.round-1+G.startOff)%4;
  G.players=[0,1,2,3].map(i=>({opened:false,pairs:false,discard:[],hand:[]}));
  for(let i=0;i<4;i++){const p=(G.starter+i)%4;G.players[p].hand=tiles.splice(0,i===0?22:21);}
  G.deck=tiles;
  G.rack=Array(26).fill(null);
  const mine=G.players[0].hand; G.players[0].hand=[];
  arrangeTiles(mine,'color');
  G.melds=[];G.mid=1;G.turn=G.starter;G.phase='play';G.taken=null;G.sel=null;G.undo=[];
  G.peek=false;G.swapUsed=false;G.over=false;G.last=null;G.newMeld=null;G.token=(G.token||0)+1;G.timeLeft=25;
  G.roundResult=null;
  save(); render();
  flash(`الجولة ${G.round}`);
  if(G.turn!==0) schedBot(); else toast('أنت تبدأ — معك 22 حجر، ارمِ حجر');
}
const hand=p=>p===0?G.rack.filter(Boolean):G.players[p].hand;
function save(){ if(G&&!G.final){ S.save=G; } persist(); }

/* ================= rack helpers ================= */
function rackGroups(){
  const gs=[];
  for(let r=0;r<2;r++){let cur=[];for(let c=0;c<13;c++){const t=G.rack[r*13+c];if(t)cur.push(t);else{if(cur.length)gs.push(cur);cur=[];}}if(cur.length)gs.push(cur);}
  return gs;
}
function placeIntoRack(groups,rest){
  const slots=Array(26).fill(null);let r=0,c=0;const over=[];
  const place=arr=>{const need=arr.length;if(c>0){if(c+1+need<=13)c++;else{r++;c=0}}if(r>1||c+need>13)return false;arr.forEach(t=>slots[r*13+(c++)]=t);return true};
  groups.forEach(g=>{if(!place(g))over.push(...g)});
  const left=[...over,...rest];
  let pos=r*13+c+(c>0?1:0);
  for(const t of left){while(pos<26&&slots[pos])pos++; if(pos<26) slots[pos++]=t; else{const k=slots.indexOf(null);slots[k]=t;}}
  G.rack=slots;
}
const sortKey=t=>{const e=eff(t);return (e.w||t.c<0)?999:e.c*20+e.n};
function arrangeTiles(tiles,kind){
  if(kind==='color'){
    const s=[...tiles].sort((a,b)=>sortKey(a)-sortKey(b));
    // group by colour with gaps
    const gs=[];let cur=[],lc=null;s.forEach(t=>{const k=Math.floor(sortKey(t)/20);if(lc!==null&&k!==lc){gs.push(cur);cur=[]}cur.push(t);lc=k});if(cur.length)gs.push(cur);
    const split=[];gs.forEach(g=>{while(g.length>13)split.push(g.splice(0,13));split.push(g)});
    // if not enough room with gaps, place compactly
    const need=split.reduce((a,g)=>a+g.length,0)+split.length-1;
    if(need<=26-2) placeIntoRack(split,[]); else {G.rack=Array(26).fill(null);s.forEach((t,i)=>G.rack[i]=t);}
    return;
  }
  if(kind==='123'){const sol=solveRuns(tiles);placeIntoRack(sol.melds,sol.rest.sort((a,b)=>sortKey(a)-sortKey(b)));return;}
  if(kind==='77'){const pr=pairsOf(tiles);const ids=new Set(pr.flat().map(t=>t.id));placeIntoRack(pr,tiles.filter(t=>!ids.has(t.id)).sort((a,b)=>sortKey(a)-sortKey(b)));}
}
function addToRack(t){
  for(let i=25;i>=0;i--) if(!G.rack[i]){G.rack[i]=t;return;}
}
function removeFromRack(id){const i=G.rack.findIndex(t=>t&&t.id===id);if(i<0)return null;const t=G.rack[i];G.rack[i]=null;return t;}
function moveToSlot(id,s){
  const from=G.rack.findIndex(t=>t&&t.id===id); if(from<0||from===s) return;
  const t=G.rack[from]; G.rack[from]=null;
  if(!G.rack[s]){G.rack[s]=t;return;}
  const row=Math.floor(s/13),end=row*13+12;
  // shift right if space in row
  let e=s;while(e<=end&&G.rack[e])e++;
  if(e<=end){for(let k=e;k>s;k--)G.rack[k]=G.rack[k-1];G.rack[s]=t;return;}
  let b=s;while(b>=row*13&&G.rack[b])b--;
  if(b>=row*13){for(let k=b;k<s;k++)G.rack[k]=G.rack[k+1];G.rack[s]=t;return;}
  G.rack[from]=G.rack[s];G.rack[s]=t;
}
function rackStatus(){
  const gs=rackGroups().map(g=>({g,v:validateMeld(g)}));
  const runs=gs.filter(x=>x.v&&x.v.type!=='pair'), prs=gs.filter(x=>x.v&&x.v.type==='pair');
  return {gs,runs,prs,pts:runs.reduce((a,x)=>a+x.v.pts,0)};
}

/* ================= actions (human) ================= */
const myTurn=()=>G&&!G.over&&G.turn===0;
function snapshot(){const b=G.boosters;G.undo.push(JSON.stringify(Object.assign({},G,{undo:[]})));if(G.undo.length>12)G.undo.shift();}
function drawDeck(){
  if(!myTurn()||G.phase!=='draw') return;
  if(!G.deck.length){endRound(null);return;}
  const t=G.deck.pop();addToRack(t);G.last=t.id;G.phase='play';G.peek=false;snd('draw');buzz(10);save();render();
}
function takeDiscard(){
  if(!myTurn()||G.phase!=='draw') return;
  const pile=G.players[3].discard; if(!pile.length){toast('ما في رمية');return;}
  snapshot();
  const t=pile.pop();addToRack(t);G.taken=t.id;G.last=t.id;G.phase='play';G.peek=false;snd('draw');
  toast('أخذت الرمية — لازم تستخدمها بنفس الدور (أو رجّعها بزر ترجيع)');
  save();render();
}
function discard(id){
  if(!myTurn()) return;
  if(G.phase!=='play'){toast('اسحب حجر أول');snd('err');return;}
  if(id==null){toast('اختر الحجر اللي تبي ترميه');snd('err');return;}
  if(G.taken!=null&&G.rack.some(t=>t&&t.id===G.taken)){
    if(G.taken===id) toast('ما تقدر ترمي نفس الحجر اللي أخذته — استخدمه أو رجّعه');
    else toast('لازم تستخدم الحجر اللي أخذته من الرمية قبل ما ترمي');
    snd('err');buzz(60);return;
  }
  const t=removeFromRack(id); if(!t) return;
  G.players[0].discard.push(t);G.sel=null;G.taken=null;G.undo=[];snd('place');buzz(15);
  if(!G.rack.some(Boolean)){ endRound(0,isWild(t)); return; }
  nextTurn();
}
function layRack(){
  if(!myTurn()) return;
  if(G.phase!=='play'){toast('اسحب حجر أول');snd('err');return;}
  const P=G.players[0];const st=rackStatus();const handN=hand(0).length;
  let use=null,asPairs=false;
  if(!P.opened){
    if(st.pts>=101) use=st.runs;
    else if(st.prs.length>=5){use=st.prs;asPairs=true;}
    else{
      toast(st.prs.length>=3?`تحتاج 101 نقطة (عندك ${st.pts}) أو 5 أزواج (عندك ${st.prs.length})`:`تحتاج 101 نقطة للنزول — عندك ${st.pts}. رتّب مجموعاتك وافصل بينها بفراغ`);
      snd('err');buzz(60);return;
    }
  }else{
    use=P.pairs?st.prs:st.runs;
    if(!use.length){toast(P.pairs?'نازل أزواج: تقدر تنزل أزواج بس، أو تركّب على النزولات':'ما في مجموعة صحيحة بالحامل (الأخضر = صحيح)');snd('err');return;}
  }
  const n=use.reduce((a,x)=>a+x.g.length,0);
  if(n>=handN){toast('لازم يبقى معك حجر واحد على الأقل ترميه');snd('err');return;}
  snapshot();
  use.forEach(x=>{x.g.forEach(t=>removeFromRack(t.id));G.melds.push({id:G.mid++,owner:0,type:x.v.type,tiles:x.v.tiles});});
  G.newMeld=G.mid-1;
  if(!P.opened){P.opened=true;P.pairs=asPairs;flash(asPairs?'نزلت أزواج!':'نزلت!');snd('lay');buzz([20,40,20]);}
  else snd('lay');
  G.sel=null;save();render();
}
function addToMeld(id,mid){
  if(!myTurn()) return;
  if(G.phase!=='play'){toast('اسحب حجر أول');snd('err');return;}
  const P=G.players[0];
  if(!P.opened){toast('لازم تنزل أول قبل ما تركّب على النزولات');snd('err');return;}
  if(hand(0).length<=1){toast('لازم يبقى معك حجر ترميه');snd('err');return;}
  const m=G.melds.find(x=>x.id===mid);const t=G.rack.find(x=>x&&x.id===id);if(!m||!t)return;
  const r=tryAddMeld(m,t,true);
  if(!r){toast('هالحجر ما يركب على هالنزول');snd('err');buzz(60);return;}
  snapshot();
  // apply (re-run on real objects)
  removeFromRack(id);applyAdd(m,t,true);
  G.sel=null;snd('lay');buzz(15);save();render();
}
/* what does the wild at index i in meld m stand for? -> {c,n} or for groups {n,missing:[colors]} */
function wildRep(m,i){
  const v=validateMeld(m.tiles,false); if(!v) return null;
  if(v.type==='group'){const nat=v.tiles.filter(t=>!isWild(t)).map(eff);return {group:true,n:nat[0].n,cols:nat.map(e=>e.c)};}
  const k=v.tiles.findIndex(t=>!isWild(t)); const e=eff(v.tiles[k]);
  // value of position k (handles ace-high)
  let vk=e.n; if(e.n===1&&k>0) vk=14;
  const idx=v.tiles.indexOf(m.tiles[i]);
  let val=vk+(idx-k); if(val===14) val=1;
  return {c:e.c,n:val};
}
/* returns 'add' | 'swap' | null */
function tryAddMeld(m,t,allowSwap){
  if(m.type==='pair') return null;
  if(allowSwap&&!isWild(t)){
    const e=eff(t);
    for(let i=0;i<m.tiles.length;i++){
      if(!isWild(m.tiles[i])) continue;
      const r=wildRep(m,i); if(!r) continue;
      if(r.group?(e.n===r.n&&!r.cols.includes(e.c)):(e.c===r.c&&e.n===r.n)) return 'swap';
    }
  }
  return validateMeld([...m.tiles,t],false)?'add':null;
}
function applyAdd(m,t,allowSwap){
  const r=tryAddMeld(m,t,allowSwap);
  if(r==='swap'){
    const e=eff(t);
    const i=m.tiles.findIndex((x,k)=>{if(!isWild(x))return false;const w=wildRep(m,k);return w&&(w.group?(e.n===w.n&&!w.cols.includes(e.c)):(e.c===w.c&&e.n===w.n));});
    const w=m.tiles[i];const arr=[...m.tiles];arr[i]=t;const v=validateMeld(arr,false);
    if(!v) return null;
    m.tiles=v.tiles;m.type=v.type;
    if(G.turn===0){addToRack(w);G.last=w.id;toast('أخذت الأوكي ★ من النزول!');}
    else G.players[G.turn].hand.push(w);
    return r;
  }
  if(r==='add'){const v=validateMeld([...m.tiles,t],false);m.tiles=v.tiles;m.type=v.type;}
  return r;
}
function nextTurn(){
  G.turnNo=(G.turnNo||0)+1;G.turn=(G.turn+1)%4;G.phase='draw';G.taken=null;G.undo=[];G.peek=false;G.swapUsed=false;G.sel=null;G.newMeld=null;G.timeLeft=25;
  save();render();
  if(G.turn!==0) schedBot();
}

/* ================= boosters ================= */
const BCOST=25;
function useBooster(k){
  if(!myTurn()) {toast('انتظر دورك');return false;}
  if(G.boosters[k]>0){G.boosters[k]--;return true;}
  if(S.gems>=BCOST){S.gems-=BCOST;persist();snd('coin');return true;}
  toast(`تحتاج ${BCOST} فنجان`);snd('err');return false;
}
function bUndo(){
  if(!myTurn()) return;
  if(!G.undo.length){toast('ما في شي ترجّعه بهالدور');snd('err');return;}
  if(!useBooster('undo')) return;
  const b=G.boosters;const snap=JSON.parse(G.undo.pop());const rest=G.undo;
  G=Object.assign(snap,{boosters:b,undo:rest,token:G.token});
  snd('tap');save();render();
}
function bHint(){
  if(!myTurn()) return;
  if(!useBooster('hint')) return;
  const P=G.players[0];const h=hand(0);
  if(G.phase==='draw'){
    const d=G.players[3].discard.slice(-1)[0];
    const want=d&&botWantsDiscard(0,d,h);
    toast(want?'خذ الرمية من اللاعب اللي قبلك':'اسحب من الكومة');
    render();return;
  }
  // arrange best
  if(!P.opened||!P.pairs){const sol=solveRuns(h); if(!P.opened&&sol.pts>=101||P.opened){arrangeTiles(h,'123');}}
  if(P.pairs) arrangeTiles(h,'77');
  const st=rackStatus();
  const t=chooseDiscard(0,hand(0));
  G.hintId=t&&t.id;G.sel=t&&t.id;
  let msg='';
  if(!P.opened&&st.pts>=101) msg='رتّبتها لك — تقدر تنزل الحين! ';
  else if(!P.opened&&st.prs.length>=5) msg='عندك 5 أزواج — تقدر تنزل أزواج! ';
  else if(P.opened&&(P.pairs?st.prs:st.runs).length) msg='عندك مجموعات تقدر تنزلها. ';
  msg+=t?`ارمِ ${t.c<0?'الجوكر':(CN[t.c]+' '+t.n)}`:'';
  toast(msg);save();render();
}
function bPeek(){
  if(!myTurn()) return;
  if(G.phase!=='draw'){toast('الكشف يشتغل قبل السحب');return;}
  if(!G.deck.length) return;
  if(!useBooster('peek')) return;
  G.peek=true;snd('tap');render();
}
function bSwap(){
  if(!myTurn()) return;
  if(G.phase!=='play'){toast('اسحب أول، بعدين بدّل');return;}
  if(G.sel==null){toast('اختر حجر تبي تبدله');return;}
  if(G.swapUsed){toast('مرة وحدة بالدور');return;}
  if(G.sel===G.taken){toast('ما تقدر تبدل حجر الرمية');return;}
  if(!G.deck.length) return;
  if(!useBooster('swap')) return;
  const i=G.rack.findIndex(t=>t&&t.id===G.sel);const old=G.rack[i];
  const nt=G.deck.pop();G.deck.splice(Math.floor(rnd()*G.deck.length),0,old);
  G.rack[i]=nt;G.last=nt.id;G.sel=null;G.swapUsed=true;G.undo=[];snd('draw');save();render();
}

/* ================= bots ================= */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let botKey=null;
function schedBot(){
  const k=G.token+':'+(G.turnNo||0);
  if(botKey===k) return; botKey=k;
  setTimeout(()=>{botTurn().catch(e=>{console.error(e);});},0);
}
function canAddAny(t){return G.melds.some(m=>tryAddMeld(m,t,false))}
function botWantsDiscard(p,d,h){
  const P=G.players[p];h=h||hand(p);
  if(G.diff===0&&p!==0&&rnd()<.4) return false;
  if(!P.opened){
    const a=solveRuns(h).pts,b=solveRuns([...h,d]).pts;
    if(b>=101&&a<101) return true;
    const pa=pairsOf(h).length,pb=pairsOf([...h,d]).length;
    if(pb>=5&&pa<5&&a<101) return true;
    return false;
  }
  if(isWild(d)) return true;
  if(P.pairs){ return h.some(t=>!isWild(t)&&eff(t).c===eff(d).c&&eff(t).n===eff(d).n)||canAddAny(d); }
  if(canAddAny(d)) return true;
  const a=solveRuns(h),b=solveRuns([...h,d]);
  return b.melds.some(m=>m.some(t=>t.id===d.id))&&b.pts>a.pts;
}
function trimKeepOne(melds,handN,needPts){
  // ensure at least one tile stays in hand
  let used=melds.reduce((a,m)=>a+m.length,0);
  if(used<handN) return melds;
  // try remove a tile from end of a run longer than 3
  for(const m of melds){ if(m.length>3){ const v=validateMeld(m.slice(0,-1),false); if(v){ const out=melds.map(x=>x===m?v.tiles:x); if(!needPts||out.reduce((a,x)=>a+meldPts(x),0)>=needPts) return out; } } }
  const sorted=[...melds].sort((a,b)=>meldPts(a)-meldPts(b));
  const out=melds.filter(m=>m!==sorted[0]);
  if(!needPts||out.reduce((a,x)=>a+meldPts(x),0)>=needPts) return out;
  return null;
}
async function botTurn(){
  const tok=G.token;const p=G.turn;if(p===0||G.over) return;
  const P=G.players[p];
  const alive=()=>G&&tok===G.token&&!G.over&&G.turn===p&&screen==='game';
  render();
  await sleep(window.__fast?0:(G.mode==='time'?380:650)); if(!alive()) return;
  if(G.phase==='draw'){
    const prev=(p+3)%4;const pile=G.players[prev].discard;const d=pile[pile.length-1];
    if(d&&botWantsDiscard(p,d)){pile.pop();P.hand.push(d);G.taken=d.id;toast(`${NAMES[p]} أخذ الرمية ${d.c<0?'الجوكر':CN[d.c]+' '+d.n}`);}
    else{ if(!G.deck.length){endRound(null);return;} P.hand.push(G.deck.pop()); }
    G.phase='play';snd('draw');save();render();
    await sleep(window.__fast?0:(G.mode==='time'?300:550)); if(!alive()) return;
  }
  // play
  let laid=false;
  if(!P.opened){
    const sol=solveRuns(P.hand);
    let melds=sol.pts>=101?trimKeepOne(sol.melds,P.hand.length,101):null;
    if(melds&&(G.taken==null||melds.some(m=>m.some(t=>t.id===G.taken)))){
      layBot(p,melds,false);P.opened=true;laid=true;flash(`${NAMES[p]} نزل!`);
    }else{
      const pr=pairsOf(P.hand);
      const pairNeed=(G.deck.length<10||sol.pts>=80)?5:6;
      if(pr.length>=pairNeed){const sel=trimKeepOne(pr,P.hand.length,0);if(sel&&sel.length>=5){layBot(p,sel,true);P.opened=true;P.pairs=true;laid=true;flash(`${NAMES[p]} نزل أزواج`);}}
    }
  }else{
    if(P.pairs){const pr=pairsOf(P.hand);const sel=pr.length?trimKeepOne(pr,P.hand.length,0):null;if(sel&&sel.length){layBot(p,sel,true);laid=true;}}
    else{const sol=solveRuns(P.hand);const sel=sol.melds.length?trimKeepOne(sol.melds,P.hand.length,0):null;if(sel&&sel.length){layBot(p,sel,false);laid=true;}}
  }
  if(P.opened){
    let ch=true;
    while(ch&&P.hand.length>1){ch=false;
      for(const t of [...P.hand]){
        if(P.hand.length<=1) break;
        if(isWild(t)&&P.hand.length>3) continue;
        const m=G.melds.find(m=>tryAddMeld(m,t,true));
        if(m){P.hand.splice(P.hand.indexOf(t),1);applyAdd(m,t,true);ch=true;laid=true;}
      }
    }
  }
  if(laid){snd('lay');save();render();await sleep(window.__fast?0:(G.mode==='time'?300:600));if(!alive())return;}
  // discard
  const t=chooseDiscard(p,P.hand);
  P.hand.splice(P.hand.indexOf(t),1);P.discard.push(t);G.taken=null;snd('place');
  if(!P.hand.length){endRound(p,isWild(t));return;}
  nextTurn();
}
function layBot(p,melds,pairs){
  const P=G.players[p];
  melds.forEach(m=>{const v=validateMeld(m,pairs);if(!v)return;v.tiles.forEach(t=>P.hand.splice(P.hand.indexOf(t),1));G.melds.push({id:G.mid++,owner:p,type:v.type,tiles:v.tiles});});
  G.newMeld=G.mid-1;
}
function chooseDiscard(p,h){
  if(h.length===1) return h[0];
  const P=G.players[p];
  let cand=h.filter(t=>!isWild(t)&&t.id!==G.taken);
  if(!cand.length) cand=h.filter(t=>t.id!==G.taken);
  if(!cand.length) cand=h;
  let usedIds=new Set();
  if(P.pairs||(!P.opened&&pairsOf(h).length>=4&&solveRuns(h).pts<60)) usedIds=new Set(pairsOf(h).flat().map(t=>t.id));
  else usedIds=new Set(solveRuns(h).melds.flat().map(t=>t.id));
  let c1=cand.filter(t=>!usedIds.has(t.id)); if(!c1.length) c1=cand;
  if(p!==0&&G.diff===0&&rnd()<.35) return c1[Math.floor(rnd()*c1.length)];
  const next=G.players[(p+1)%4];
  let best=null,bs=-1e9;
  for(const t of c1){
    const e=eff(t);let u=0;
    for(const o of h){ if(o===t) continue; if(isWild(o)) continue; const eo=eff(o);
      if(eo.c===e.c&&Math.abs(eo.n-e.n)===1) u+=3; else if(eo.c===e.c&&Math.abs(eo.n-e.n)===2) u+=1.4;
      if(eo.n===e.n&&eo.c!==e.c) u+=2; if(eo.n===e.n&&eo.c===e.c) u+=(P.pairs||!P.opened)?2.5:.8; }
    if(P.opened&&canAddAny(t)) u+=6;
    let sc=-u*10+e.n;
    if((G.diff===2||p===0)&&next.opened&&canAddAny(t)) sc-=25;
    if(t.c<0) sc-=15;
    if(sc>bs){bs=sc;best=t;}
  }
  return best||c1[0];
}

/* ================= round end ================= */
function endRound(winner,okeyFinish){
  if(G.over) return;
  G.over=true;G.token++;stopTimer();
  const mult=(winner!=null&&okeyFinish)?2:1;
  const pen=[0,1,2,3].map(p=>{
    const P=G.players[p];
    if(p===winner) return -101*mult;
    if(!P.opened) return 202*mult;
    return hand(p).reduce((a,t)=>a+tval(t),0)*(P.pairs?2:1)*mult;
  });
  pen.forEach((v,i)=>G.totals[i]+=v);
  G.history.push(pen);
  G.roundResult={winner,okeyFinish,pen};
  if(winner===0){G.outs++;S.stats.outs++;}
  S.stats.rounds++;
  persist();
  if(winner===0){snd('win');buzz([30,60,30]);flash(okeyFinish?'خلّصت بالأوكي! ×2':'فزت بالجولة!');}
  else if(winner!=null){snd('lose');flash(`${NAMES[winner]} خلّص`);}
  else flash('خلصت الكومة');
  save();render();
  setTimeout(()=>showRoundModal(),1100);
}
function showRoundModal(){
  if(!G||!G.roundResult||screen!=='game') return;
  const r=G.roundResult;const last=G.round>=G.rounds;
  const rows=[0,1,2,3].map(p=>`<tr class="${p===0?'me':''}"><td class="nm">${NAMES[p]}${p===r.winner?' ★':''}${G.players[p].pairs?' <span class="badge pr">أزواج</span>':''}${!G.players[p].opened&&p!==r.winner?' <small style="color:var(--mut)">ما نزل</small>':''}</td><td dir="ltr">${r.pen[p]>0?'+':''}${r.pen[p]}</td><td dir="ltr"><b>${G.totals[p]}</b></td></tr>`).join('');
  const title=r.winner===0?'فزت بالجولة!':r.winner!=null?`${NAMES[r.winner]} خلّص حجاره`:'خلصت الكومة — تعادل';
  modal(`<h2>${title}</h2><div class="sub">الجولة ${G.round} من ${G.rounds}${r.okeyFinish?' · خلّص بالأوكي ×2':''}</div>
  <table class="res"><tr><th></th><th>الجولة</th><th>المجموع</th></tr>${rows}</table>
  <div class="sub" style="font-size:12px">الأقل نقاط يفوز · الفائز −101 · اللي ما نزل +202 · نازل الأزواج ×2</div>
  <button class="btn" id="mNext">${last?'النتيجة النهائية':'الجولة التالية'}</button>`,false);
  $('#mNext').onclick=()=>{closeModal(); if(last) finishGame(); else startRound();};
}
function finishGame(){
  const order=[0,1,2,3].sort((a,b)=>G.totals[a]-G.totals[b]);
  const place=order.indexOf(0)+1;
  const won=place===1;
  G.final=true;S.save=null;
  S.stats.games++;
  let gems=0,stars=0,extra='';
  if(won){S.stats.wins++;S.streak++;gems=30+Math.min(S.streak,5)*5;}
  else{S.streak=0;gems=place===2?10:4;}
  if(G.mode==='adventure'&&won){
    stars=G.outs>=Math.ceil(G.rounds/2)?3:G.totals[0]<0?2:1;
    const prev=S.stars[G.level]||0; if(stars>prev){gems+=(stars-prev)*10;S.stars[G.level]=stars;}
    if(G.level===S.level) S.level++;
  }
  if(G.mode==='daily'){const d=today();const old=S.daily[d];if(!old){gems+=won?40:10;}S.daily[d]={place,total:G.totals[0]};}
  if(G.mode==='time'&&won) gems+=15;
  if((G.mode==='classic'||G.mode==='time')&&(S.best==null||G.totals[0]<S.best)){S.best=G.totals[0];extra='<div class="sub" style="color:var(--accent)">أفضل نتيجة جديدة!</div>';}
  S.gems+=gems;persist();
  if(won) snd('win'); else snd('lose');
  const rows=order.map((p,i)=>`<tr class="${p===0?'me':''}"><td>${i+1}</td><td class="nm">${NAMES[p]}</td><td dir="ltr"><b>${G.totals[p]}</b></td></tr>`).join('');
  const st=G.mode==='adventure'?`<div class="stars">${[1,2,3].map(i=>`<span class="${i<=stars?'on':''}">★</span>`).join('')}</div>`:'';
  modal(`<h2>${won?'مبروك! المركز الأول':place===2?'المركز الثاني':'المركز '+(place===3?'الثالث':'الرابع')}</h2>
   ${st}<div class="sub">${G.mode==='adventure'?'المستوى '+G.level+' · ':''}${S.streak>1?'سلسلة فوز ×'+S.streak+' · ':''}+${gems} فنجان</div>${extra}
   <table class="res"><tr><th>#</th><th></th><th>النقاط</th></tr>${rows}</table>
   ${G.mode==='adventure'&&won?'<button class="btn" id="mA">المستوى التالي</button>':'<button class="btn" id="mA">العب مرة ثانية</button>'}
   <button class="btn alt" id="mH">الرئيسية</button>`,false);
  $('#mA').onclick=()=>{closeModal();const m=G.mode;newGame(m,{level:m==='adventure'?S.level:undefined});};
  $('#mH').onclick=()=>{closeModal();goHome();};
}

/* ================= time attack ================= */
setInterval(()=>{
  if(screen!=='game'||!G||G.over||document.querySelector('.modal')||document.hidden) return;
  G.elapsed=(G.elapsed||0)+1;
  if(!(G.mode==='time'&&myTurn())){const el=document.getElementById('clkT');if(el)el.textContent=fmtT(G.elapsed);}
},1000);
let timerI=null;
function stopTimer(){if(timerI){clearInterval(timerI);timerI=null;}}
function ensureTimer(){
  if(G&&G.mode==='time'&&myTurn()&&screen==='game'){
    if(!timerI) timerI=setInterval(()=>{
      if(!G||!myTurn()||screen==='game'&&document.querySelector('.modal')){return;}
      G.timeLeft--; const el=document.getElementById('clkT');
      if(el){el.textContent=fmtT(Math.max(0,G.timeLeft));$('#clk').classList.toggle('low',G.timeLeft<=7);}
      if(G.timeLeft<=5&&G.timeLeft>0) snd('tick');
      if(G.timeLeft<=0){autoPlay();}
    },1000);
  }else stopTimer();
}
function autoPlay(){
  stopTimer();
  if(G.phase==='draw') drawDeck();
  if(!myTurn()) return;
  if(G.taken!=null&&G.rack.some(t=>t&&t.id===G.taken)){bUndoFree();}
  if(G.phase==='draw') drawDeck();
  if(!myTurn()) return;
  const t=chooseDiscard(0,hand(0));toast('خلص الوقت! رمينا عنك');discard(t.id);
}
function bUndoFree(){while(G.undo.length){const b=G.boosters;const snap=JSON.parse(G.undo.pop());G=Object.assign(snap,{boosters:b,undo:G.undo,token:G.token});}}

function flash(m){const g=document.querySelector('.game');if(!g)return;const d=document.createElement('div');d.className='flash';d.textContent=m;g.appendChild(d);setTimeout(()=>d.remove(),1250);}
function modal(html,closable=true){closeModal();const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="sheet">${html}</div>`;if(closable)m.addEventListener('click',e=>{if(e.target===m)closeModal()});document.body.appendChild(m);}
function closeModal(){document.querySelectorAll('.modal').forEach(m=>m.remove());}
const ICO={
  timer:'<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>',
  menu:'<svg class="ico" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg>',
  cup:'<svg viewBox="0 0 24 24"><path d="M5 8h11v5a5.5 5.5 0 0 1-11 0zM16 9.5h1.5a2.5 2.5 0 0 1 0 5H16M4 20h13" stroke="currentColor" stroke-width="1.6" fill="currentColor" fill-opacity=".9"/><path d="M8 3.5c0 1.2 1.2 1.2 1.2 2.4M11.5 3.5c0 1.2 1.2 1.2 1.2 2.4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>'
};
const cupsHTML=(plus)=>`<span class="cups">${ICO.cup}<b>${S.gems}</b>${plus?'<button class="plus" id="gift" aria-label="فنجان الضيافة اليومي">+</button>':''}</span>`;
function tileHTML(t,cls=''){
  if(!t) return '';
  const fake=t.c<0,w=G&&isWild(t);
  return `<div class="tile ${fake?'fake':'c'+t.c} ${cls}" data-id="${t.id}">${fake?'<span class="fj">❖</span>':`<b>${t.n}</b>`}<i></i>${w?'<s>★</s>':''}</div>`;
}
const demoTile=(n,c,extra='')=>`<div class="tile ${c<0?'fake':'c'+c}">${c<0?'<span class="fj">❖</span>':`<b>${n}</b>`}<i></i>${extra==='wild'?'<s>★</s>':''}</div>`;
function sizeTiles(){
  const W=Math.min(window.innerWidth,560);
  const tw=Math.max(20,Math.min(38,Math.floor((W-20-16-12*3)/13)));
  document.documentElement.style.setProperty('--tw',tw+'px');
  document.documentElement.style.setProperty('--mw',Math.max(16,Math.min(24,Math.floor(tw*.74)))+'px');
}
window.addEventListener('resize',()=>{sizeTiles();});
sizeTiles();
const fmtT=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

/* ---------- home ---------- */
function goHome(){screen='home';stopTimer();closeModal();if(G&&!G.final){G.token++;save();}render();}
function renderHome(){
  const totalStars=Object.values(S.stars).reduce((a,b)=>a+b,0);
  const sv=S.save&&!S.save.final?S.save:null;
  const dailyDone=S.daily[today()];
  const row=(m,c,n,title,sub,hl)=>`<button class="mode ${hl?'hl':''}" data-m="${m}"><span class="pip" style="color:var(--t${c})">${n}<i></i></span><span><b>${title}</b><small>${sub}</small></span>${hl?'<span class="go">كمّل</span>':''}</button>`;
  app.innerHTML=`<div class="band"></div>
  <div class="home"><div class="medal"></div>
    <div class="toprow"><span class="lv">${S.stats.games?`فزت ${S.stats.wins} من ${S.stats.games}`:'أهلًا بالديوانية'}</span>${cupsHTML(true)}</div>
    <div class="hero">
      <div class="minirack">${demoTile(1,0)}${demoTile(0,-1)}${demoTile(1,2)}</div>
      <h1 class="name">ديوانية <span>١٠١</span></h1>
      <div class="tag">اقعد على الزولية، رتّب حجارك، وانزل بـ١٠١ قبل الربع</div>
    </div>
    <div class="modes">
      ${row('adventure',0,S.level,'المغامرة',`المستوى ${S.level} · ★ ${totalStars}${S.streak>1?' · فوز متتالي ×'+S.streak:''}`,sv&&sv.mode==='adventure')}
      ${row('classic',2,S.rounds,'قعدة ديوانية',`${S.rounds} جولات ضد ٣ لاعبين · ${DIFFN[S.diff]}`,sv&&sv.mode==='classic')}
      ${row('daily',1,new Date().getDate(),'تحدي اليوم',dailyDone?`خلّصته · المركز ${dailyDone.place}`:'<span class="new">جديد</span> · نفس التوزيعة للكل',sv&&sv.mode==='daily')}
      ${row('time',3,25,'على السريع','٢٥ ثانية لكل دور',sv&&sv.mode==='time')}
    </div>
    <div class="links">
      <button id="hHow">طريقة اللعب</button><button id="hThemes">الزوالي</button><button id="hStats">إحصائياتك</button><button id="hSound">الصوت: ${S.sound?'شغّال':'مطفي'}</button>
    </div>
  </div><div class="band"></div>`;
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{snd('tap');openMode(b.dataset.m)});
  $('#gift').onclick=()=>{if(S.gift===today()){toast('أخذت فنجان اليوم. ارجع بكرة');return;}S.gift=today();S.gems+=50;persist();snd('coin');toast('+50 فنجان ضيافة اليوم');render();};
  $('#hThemes').onclick=themesModal;$('#hHow').onclick=()=>howTo(0);
  $('#hSound').onclick=()=>{S.sound=!S.sound;persist();snd('tap');render();};
  $('#hStats').onclick=statsModal;
}
function openMode(m){
  const sv=S.save;
  const start=()=>{newGame(m);screen='game';render();};
  const resume=()=>{G=sv;screen='game';G.token=(G.token||0)+1;render();if(G.over&&G.roundResult)showRoundModal();else if(G.turn!==0)schedBot();};
  if(m==='classic'){
    modal(`<h2>كلاسيك</h2><div class="sub">أوكي 101 ضد 3 لاعبين</div>
     <div class="lbl">عدد الجولات</div><div class="seg" id="sR">${[1,3,5].map(r=>`<button data-v="${r}" class="${S.rounds===r?'on':''}">${r}</button>`).join('')}</div>
     <div class="lbl">مستوى الخصوم</div><div class="seg" id="sD">${DIFFN.map((d,i)=>`<button data-v="${i}" class="${S.diff===i?'on':''}">${d}</button>`).join('')}</div>
     ${sv&&sv.mode==='classic'?'<button class="btn" id="cRes">كمّل لعبتك</button><button class="btn alt" id="cNew">لعبة جديدة</button>':'<button class="btn" id="cNew">ابدأ</button>'}`);
    document.querySelectorAll('#sR button').forEach(b=>b.onclick=()=>{S.rounds=+b.dataset.v;persist();document.querySelectorAll('#sR button').forEach(x=>x.classList.toggle('on',x===b))});
    document.querySelectorAll('#sD button').forEach(b=>b.onclick=()=>{S.diff=+b.dataset.v;persist();document.querySelectorAll('#sD button').forEach(x=>x.classList.toggle('on',x===b))});
    if($('#cRes')) $('#cRes').onclick=()=>{closeModal();resume();};
    $('#cNew').onclick=()=>{closeModal();start();};
    return;
  }
  if(sv&&sv.mode===m&&!sv.final){resume();return;}
  if(m==='daily'&&S.daily[today()]){
    modal(`<h2>تحدي اليوم</h2><div class="sub">خلّصته اليوم — المركز ${S.daily[today()].place} بنقاط ${S.daily[today()].total}</div><div class="sub">نفس التوزيعة لكل اللاعبين. تقدر تعيدها للتدريب (بدون جوائز).</div><button class="btn" id="dAg">العب مرة ثانية</button><button class="btn alt" onclick="">رجوع</button>`);
    $('#dAg').onclick=()=>{closeModal();start();};
    document.querySelector('.btn.alt').onclick=closeModal;return;
  }
  if(sv&&!sv.final&&sv.mode!==m){
    modal(`<h2>عندك لعبة ما خلصت</h2><div class="sub">لو بدأت لعبة جديدة بتنحذف لعبتك في «${{adventure:'المغامرة',classic:'كلاسيك',daily:'تحدي اليوم',time:'تحدي الوقت'}[sv.mode]}»</div><button class="btn" id="oN">ابدأ الجديدة</button><button class="btn alt" id="oR">كمّل القديمة</button>`);
    $('#oN').onclick=()=>{closeModal();start();};$('#oR').onclick=()=>{closeModal();G=sv;resume();};return;
  }
  start();
}
function themesModal(){
  const th=[['madder','زولية حمرا','#5b1420'],['indigo','زولية زرقا','#1c2748'],['green','زولية خضرا','#1e3b2c'],['day','قعدة الصبح','#c9b38a']];
  modal(`<h2>الزوالي</h2><div class="sub">اختر الزولية اللي تلعب عليها</div><div class="themes">${th.map(([k,n,bg])=>`<button class="th ${S.theme===k?'on':''}" data-t="${k}" style="background:${bg}"><span>${n}</span></button>`).join('')}</div>
  <div class="lbl" style="margin-top:14px">الاهتزاز</div><div class="seg" id="vb"><button data-v="1" class="${S.vib?'on':''}">شغّال</button><button data-v="0" class="${!S.vib?'on':''}">مطفي</button></div>
  <button class="btn" id="thDone">تم</button>`);
  document.querySelectorAll('.th').forEach(b=>b.onclick=()=>{S.theme=b.dataset.t;persist();document.documentElement.dataset.theme=S.theme;document.querySelectorAll('.th').forEach(x=>x.classList.toggle('on',x===b));snd('tap');});
  document.querySelectorAll('#vb button').forEach(b=>b.onclick=()=>{S.vib=b.dataset.v==='1';persist();document.querySelectorAll('#vb button').forEach(x=>x.classList.toggle('on',x===b));});
  $('#thDone').onclick=()=>{closeModal();render();};
}
function menuModal(){
  modal(`<h2>القائمة</h2><div class="sub">${MODEN[G.mode]}${G.mode==='adventure'?' · المستوى '+G.level:''} · الجولة ${G.round} من ${G.rounds}</div>
  <div class="menu"><button class="btn" id="mnRes">كمّل اللعب</button><button class="btn alt" id="mnHow">طريقة اللعب</button><button class="btn alt" id="mnTh">الزوالي</button>
  <button class="btn alt" id="mnSnd">الصوت: ${S.sound?'شغّال':'مطفي'}</button><button class="btn alt" id="mnNew">لعبة جديدة</button><button class="btn alt" id="mnHome">الرئيسية</button></div>`);
  $('#mnRes').onclick=closeModal;$('#mnHow').onclick=()=>howTo(0);$('#mnTh').onclick=themesModal;

  <tr><td class="nm">الجولات</td><td><b>${s.rounds}</b></td></tr><tr><td class="nm">خلّصت حجارك</td><td><b>${s.outs}</b></td></tr>

function howTo(i){
  const W=(n,c)=>demoTile(n,c,'wild');
  const pages=[
    ['هدف اللعبة',`<div class="demo">${demoTile(8,0)}${demoTile(9,0)}${demoTile(10,0)}${demoTile(11,0)}<span class="sp"></span>${demoTile(13,0)}${demoTile(13,1)}${demoTile(13,3)}</div>
     <p>تخلّص من <b>كل حجارك قبل الكل</b>، وأنهِ الجولات <b>بأقل نقاط</b>. اللعبة فيها 106 حجر: 4 ألوان (أحمر، أصفر، أزرق، أسود) من 1 إلى 13 مكررة مرتين، وجوكرين مزيفين ❖.</p>
     <p>كل لاعب ياخذ 21 حجر، واللي يبدأ ياخذ 22 ويبدأ برمي حجر.</p>`],
    ['المؤشر والأوكي',`<div class="demo"><span style="font-size:13px">المؤشر</span>${demoTile(7,2)}<span>→</span><span style="font-size:13px">الأوكي</span>${demoTile(8,2,'wild')}</div>
     <p>بعد التوزيع ينقلب حجر بالوسط اسمه <b>المؤشر</b>. <b>الأوكي ★</b> هو نفس لون المؤشر <b>+1</b> (وبعد 13 يجي 1).</p>
     <p>الأوكي يحل محل <b>أي حجر</b> تحتاجه. والجوكر المزيف ❖ ياخذ قيمة الأوكي الحقيقية (نفس اللون والرقم).</p>
     <div class="demo">${demoTile(5,3)}${W(8,2)}${demoTile(7,3)}<span>=</span>${demoTile(5,3)}${demoTile(6,3)}${demoTile(7,3)}</div>`],
    ['شرط النزول',`<p>عشان تنزل أول مرة لازم مجموع مجموعاتك يكون <b>101 نقطة أو أكثر</b>:</p>
     <div class="demo">${demoTile(2,2)}${demoTile(3,2)}${demoTile(4,2)}<span class="sp"></span><span style="font-size:12px">سلسلة: 3+ متتالية بنفس اللون</span></div>
     <div class="demo">${demoTile(6,0)}${demoTile(6,1)}${demoTile(6,3)}<span class="sp"></span><span style="font-size:12px">مجموعة: 3–4 بنفس الرقم وألوان مختلفة</span></div>
     <p>أو تنزل <b>5 أزواج</b> — كل زوج حجرين متطابقين بالرقم واللون.</p>
     <div class="demo">${demoTile(5,0)}${demoTile(5,0)}<span class="sp"></span>${demoTile(12,2)}${demoTile(12,2)}<span class="sp"></span>…</div>`],
    ['خلال دورك',`<p>١. <b>اسحب</b> حجر من الكومة، أو خذ <b>رمية اللاعب اللي قبلك</b> — بشرط تستخدمها بنفس الدور.</p>
     <p>٢. <b>انزل</b> مجموعاتك. بعد ما تنزل، تقدر <b>تركّب</b> حجارك على أي نزول على الطاولة (حتى نزولات غيرك)، وتقدر تاخذ الأوكي ★ من نزول لو حطيت مكانه الحجر الحقيقي.</p>
     <p>٣. <b>ارمِ</b> حجر عشان تنهي دورك. لازم دايمًا يبقى معك حجر ترميه.</p>
     <p>نازل الأزواج ما يقدر ينزل سلاسل بعدها، بس يقدر يركّب على النزولات، ونقاطه تتضاعف.</p>`],
    ['النقاط',`<table class="res"><tr><td class="nm">اللي خلّص حجاره</td><td dir="ltr"><b>−101</b></td></tr><tr><td class="nm">خلّص برمي الأوكي</td><td dir="ltr"><b>−202</b> والكل ×2</td></tr>
     <tr><td class="nm">اللي ما نزل</td><td dir="ltr"><b>+202</b></td></tr><tr><td class="nm">اللي نزل</td><td>مجموع حجاره</td></tr><tr><td class="nm">نازل الأزواج</td><td>مجموع حجاره ×2</td></tr></table>
     <p>بعد آخر جولة، <b>الأقل نقاط</b> هو الفائز.</p>`],
    ['التحكم',`<div class="demo">${demoTile(2,2,'')}${demoTile(3,2)}${demoTile(4,2)}<span class="sp"></span>${demoTile(9,0)}${demoTile(12,3)}</div>
     <p>• <b>اسحب الحجارة</b> بإصبعك لترتيبها على الحامل. <b>الفراغ</b> يفصل بين المجموعات، والمجموعة الصحيحة تنور <b style="color:var(--ok)">بالأخضر</b> ويظهر عدّاد النقاط /101.</p>
     <p>• زر <b dir="ltr">123</b> يرتب لك أفضل سلاسل ومجموعات، وزر <b dir="ltr">77</b> يرتب الأزواج.</p>
     <p>• اضغط حجر لاختياره، بعدين اضغط «ارمِ»، أو اضغط على نزول بالطاولة لتركّبه — أو اسحبه مباشرة للرمية أو للنزول.</p>
     <p>• المساعدات: ترجيع، تلميح، كشف الكومة، وتبديل حجر — لها استخدامات مجانية، وبعدها بالفناجين.</p>`]

  $('#hp').onclick=()=>howTo(i-1);

/* ---------- game ---------- */
function renderGame(){
  const P0=G.players[0];
  const st=rackStatus();
  const okGroups=new Set();st.gs.forEach(x=>{if(x.v&&(!(P0.opened&&P0.pairs)||x.v.type==='pair'))x.g.forEach(t=>okGroups.add(t.id))});
  const opp=p=>{const P=G.players[p];const top=P.discard[P.discard.length-1];const takeable=p===3&&myTurn()&&G.phase==='draw'&&top;
    return `<div class="opp ${G.turn===p&&!G.over?'turn':''}"><div class="av"><span style="--c:${AVC[p]}">${AVI[p]}</span></div>
     <div class="info"><div class="nm">${NAMES[p]}${G.turn===p&&!G.over?' <span class="thinking">•••</span>':''}</div>
     <div class="meta"><span>${P.hand.length} حجر</span><b>${G.totals[p]}</b>${P.opened?`<span class="badge ${P.pairs?'pr':''}">${P.pairs?'أزواج':'نزل'}</span>`:''}</div></div>
     <div class="dis ${takeable?'take':''}" ${p===3?'id="takePile"':''}>${top?tileHTML(top,'mini'):''}</div></div>`;};
  const byOwner=[0,1,2,3].map(o=>G.melds.filter(m=>m.owner===o)).map((ms,o)=>ms.length?`<div class="mrow"><span class="who">${NAMES[o]}</span>${ms.map(m=>`<div class="meld ${m.id===G.newMeld?'newm':''}" data-mid="${m.id}">${m.tiles.map(t=>tileHTML(t,'mini')).join('')}</div>`).join('')}</div>`:'').join('');
  const myPileTop=P0.discard[P0.discard.length-1];
  const leftTop=G.players[3].discard.slice(-1)[0];
  const canDraw=myTurn()&&G.phase==='draw';
  const b=G.boosters;const bl=k=>b[k]>0?`مجاني · ${b[k]}`:`${BCOST} فنجان`;
  // deck drawn as stacks of five, like on a real carpet
  const n=G.deck.length,ns=Math.min(4,Math.ceil(n/5));
  const stacks=Array.from({length:ns},(_,k)=>{const h=k===ns-1&&n%5?n%5:5;return `<span class="stk">${'<i></i>'.repeat(h)}</span>`}).join('');
  let msg='';
  if(myTurn()){
    if(G.phase==='draw') msg='اسحب من الكومة أو خذ الرمية';
    else if(G.taken!=null&&G.rack.some(t=>t&&t.id===G.taken)) msg='استخدم حجر الرمية';
    else msg=P0.opened?'نزّل أو ركّب، ثم ارمِ':'رتّب وانزل، أو ارمِ حجر';
  }else if(!G.over) msg=`دور ${NAMES[G.turn]}`;
  const timeMode=G.mode==='time'&&myTurn();
  app.innerHTML=`<div class="band thin"></div><div class="game">
   <div class="ghead">
     <button class="rbtn" id="gMenu" aria-label="القائمة">${ICO.menu}</button>
     <div class="gmid"><b>${MODEN[G.mode]}</b><small>${G.mode==='adventure'?'المستوى '+G.level+' · ':''}الجولة ${G.round} من ${G.rounds} · الكومة ${G.deck.length}</small></div>
     <div class="plaque"><small>مجموعك</small><b>${G.totals[0]}</b></div>
   </div>
   <div class="subrow">
     <span class="pillx ${timeMode&&G.timeLeft<=7?'low':''}" id="clk">${ICO.timer}<span id="clkT">${timeMode?fmtT(G.timeLeft):fmtT(G.elapsed||0)}</span></span>
     <span class="pillx">الأفضل <b>${S.best==null?'—':S.best}</b></span>
     <span class="grow"></span>${cupsHTML(false)}
   </div>
   <div class="opps">${opp(3)}${opp(2)}${opp(1)}</div>
   <div class="board"><div class="medal"></div>
     <div class="table" id="table">${byOwner||'<div class="empty">الزولية فاضية. أول نزول يحتاج ١٠١ نقطة أو ٥ أزواج</div>'}</div>
     <div class="center">
       <div class="pile ${canDraw&&leftTop?'active':''}" id="takePile2"><div class="slotbox">${leftTop?tileHTML(leftTop):''}</div><span>رمية ${NAMES[3]}</span></div>
       <div class="pile deck ${canDraw?'active':''}" id="deck"><div class="stacks">${G.peek&&n?`<span class="stk peek">${tileHTML(G.deck[n-1])}</span>`:''}${stacks}<span class="cnt">${n}</span></div><span>الكومة</span></div>
       <div class="indic"><div class="lab">المؤشر</div>${tileHTML(G.ind)}<div class="lab">الأوكي<br><b>${CN[G.okC]} ${G.okN}</b></div></div>
       <div class="pile" id="myPile"><div class="slotbox">${myPileTop?tileHTML(myPileTop):''}</div><span>رميتك</span></div>
     </div>
   </div>
   <div class="status">
     ${!P0.opened?`<span>نقاطك <b class="${st.pts>=101?'good':''}">${st.pts}</b>/١٠١ · أزواج <b class="${st.prs.length>=5?'good':''}">${st.prs.length}</b>/٥</span>`:`<span><b class="good">${P0.pairs?'نازل أزواج':'نازل'}</b></span>`}
     ${msg?`<span class="msg">${msg}</span>`:''}
   </div>
   <div class="actions">
     <button class="act bone" id="a123">123</button><button class="act bone" id="a77">77</button>
     <button class="act lay" id="aLay" ${myTurn()&&G.phase==='play'?'':'disabled'}>${P0.opened?'نزّل':'انزل'}</button>
     <button class="act dis" id="aDis" ${myTurn()&&G.phase==='play'?'':'disabled'}>ارمِ</button>
   </div>
   <div class="boost">
     <button class="bst" id="bU" ${myTurn()?'':'disabled'}><b>ترجيع</b><small>${bl('undo')}</small></button>
     <button class="bst" id="bH" ${myTurn()?'':'disabled'}><b>تلميح</b><small>${bl('hint')}</small></button>
     <button class="bst" id="bP" ${myTurn()&&G.phase==='draw'?'':'disabled'}><b>كشف</b><small>${bl('peek')}</small></button>
     <button class="bst" id="bS" ${myTurn()&&G.phase==='play'?'':'disabled'}><b>تبديل</b><small>${bl('swap')}</small></button>
   </div>
   <div class="rack ${myTurn()?'myturn':''}" id="rack">${[0,1].map(r=>`<div class="rrow">${Array.from({length:13},(_,c)=>{const i=r*13+c;const t=G.rack[i];
      const cls=[t&&okGroups.has(t.id)?'ok':'',t&&G.sel===t.id?'sel':'',t&&G.last===t.id?'newt':'',t&&G.hintId===t.id?'hint':''].join(' ');
      return `<div class="slot" data-slot="${i}">${t?tileHTML(t,cls):''}</div>`}).join('')}</div>`).join('')}</div>
  </div>`;
  G.last=null;G.hintId=null;
  bindGame();
  ensureTimer();
}
function bindGame(){
  $('#gMenu').onclick=()=>{snd('tap');menuModal();};
  $('#deck').onclick=()=>drawDeck();
  const tp=()=>takeDiscard();
  $('#takePile2').onclick=tp; const t3=$('#takePile'); if(t3) t3.onclick=tp;
  $('#myPile').onclick=()=>{if(G.sel!=null)discard(G.sel);};
  $('#a123').onclick=()=>{arrangeTiles(hand(0),'123');snd('tap');save();render();};
  $('#a77').onclick=()=>{arrangeTiles(hand(0),'77');snd('tap');save();render();};
  $('#aLay').onclick=layRack;
  $('#aDis').onclick=()=>discard(G.sel);
  $('#bU').onclick=bUndo;$('#bH').onclick=bHint;$('#bP').onclick=bPeek;$('#bS').onclick=bSwap;
  document.querySelectorAll('.meld').forEach(m=>m.onclick=()=>{if(G.sel!=null)addToMeld(G.sel,+m.dataset.mid);else if(myTurn()&&G.players[0].opened)toast('اختر حجر من حاملك أول، بعدين اضغط على النزول');});
  document.querySelectorAll('.slot').forEach(s=>s.addEventListener('click',e=>{if(e.target.closest('.tile'))return;if(G.sel!=null){moveToSlot(G.sel,+s.dataset.slot);G.sel=null;snd('place');save();render();}}));
  const tb=$('#table');if(tb&&G.newMeld){const el=tb.querySelector(`[data-mid="${G.newMeld}"]`);if(el)el.scrollIntoView({block:'nearest'});}
}
/* drag & tap on rack */
let drag=null;
document.addEventListener('pointerdown',e=>{
  if(screen!=='game'||!G) return;
  const el=e.target.closest('.rack .tile'); if(!el) return;
  e.preventDefault();
  drag={id:+el.dataset.id,x:e.clientX,y:e.clientY,el,moved:false,ghost:null,hot:null};
});
document.addEventListener('pointermove',e=>{
  if(!drag) return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6){
    drag.moved=true;drag.ghost=drag.el.cloneNode(true);drag.ghost.classList.remove('sel','ok','newt');drag.ghost.classList.add('ghost');
    document.body.appendChild(drag.ghost);drag.el.classList.add('dragging');
  }
  if(drag.moved){
    drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
    const under=document.elementFromPoint(e.clientX,e.clientY);
    document.querySelectorAll('.meld.target,.slot.hot').forEach(x=>x.classList.remove('target','hot'));
    const m=under&&under.closest('.meld');if(m)m.classList.add('target');
    const s=under&&under.closest('.slot');if(s)s.classList.add('hot');
  }
});
document.addEventListener('pointerup',e=>{
  if(!drag) return; const d=drag; drag=null;
  if(d.moved){
    d.ghost.remove();
    const under=document.elementFromPoint(e.clientX,e.clientY);
    const slot=under&&under.closest('[data-slot]'),meld=under&&under.closest('.meld'),pile=under&&under.closest('#myPile');
    if(slot){moveToSlot(d.id,+slot.dataset.slot);snd('place');save();render();}
    else if(meld){addToMeld(d.id,+meld.dataset.mid);render();}
    else if(pile){discard(d.id);}
    else render();
  }else{
    G.sel=G.sel===d.id?null:d.id;snd('tap');render();
  }
});
document.addEventListener('pointercancel',()=>{if(drag){if(drag.ghost)drag.ghost.remove();drag=null;render();}});

function render(){
  if(screen==='game'&&G) renderGame(); else {screen='home';renderHome();}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});

window.__sadu={get G(){return G},set G(v){G=v},validateMeld,solveRuns,pairsOf,newGame,startRound,drawDeck,discard,layRack,chooseDiscard,hand,arrangeTiles,addToMeld,takeDiscard,endRound,get screen(){return screen},set screen(v){screen=v},render,rackStatus};
render();

if(!seen)setTimeout(()=>howTo(0),300);
})();
